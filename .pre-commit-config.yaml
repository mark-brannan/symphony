# Local secret-leak guards. Install with `scripts/setup-git-filters.sh`
# (which runs `pre-commit install` for you) -- see RUNBOOK.md.
#
# These give fast feedback at commit time. They are NOT the enforcement
# boundary: any of them can be skipped with `--no-verify`, or simply never
# installed on a fresh clone. The real gate is .github/workflows/validate.yml,
# which runs the same checks plus a verified-secret scan on every push and
# cannot be bypassed from a laptop.
#
# Upgrading: run `pre-commit autoupdate` while you have connectivity --
# it fetches new hook revisions, so it is a dockside operation, not an
# underway one. Commit the resulting rev change so every machine and CI
# agree on which scanner version cleared a given commit.

minimum_pre_commit_version: "3.0.0"

repos:
  # Broad secret detection. Catches credential-shaped strings in files that
  # sops has never been told about -- which is the realistic leak path,
  # since anything already in .sops.yaml is encrypted by the clean filter
  # before git ever sees it.
  #
  # The -docker variant pins an exact image rather than using whatever
  # `gitleaks` happens to be on PATH; a stale distro build would run a
  # different (and differently-spelled) scanner than CI does.
  #
  # --redact is non-negotiable: without it gitleaks prints the secret it
  # found into the terminal and CI logs, turning a near-miss into a real
  # exposure.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-docker
        name: gitleaks (scan staged changes for secrets)

  - repo: local
    hooks:
      # .sops.yaml is the single source of truth for which files carry
      # secrets. This asserts .gitattributes still agrees with it -- a file
      # with a sops rule but no filter entry commits as PLAINTEXT, silently.
      - id: sops-config-consistency
        name: sops config consistency (.sops.yaml <-> .gitattributes)
        entry: python3 scripts/sops_paths.py check
        language: system
        pass_filenames: false
        files: '^(\.sops\.yaml|\.gitattributes)$'

      # Staged-content guard: never-tracked files, missing encryption
      # markers, and a cleartext-credential sweep. See the script header.
      - id: sops-secret-guard
        name: staged secrets guard (encryption markers + cleartext sweep)
        entry: scripts/precommit_secret_guard.sh
        language: system
        pass_filenames: false
        always_run: true

      # The unit tests for the two scripts that rewrite secret-bearing
      # content: the pseudonym substitution the clean filter applies, and
      # the recipient edits a key rotation makes. Both fail silently and
      # expensively -- a wrong substitution leaks an address, a missed
      # recipient list makes a file unreadable once the old key is gone --
      # so they run on any change to the scripts. Stdlib unittest, no
      # dependency, well under a second.
      - id: secret-tooling-tests
        name: unit tests (pseudonymize, sops recipients)
        entry: bash -c 'python3 scripts/test_pseudonymize.py -q && python3 scripts/test_sops_recipients.py -q'
        language: system
        pass_filenames: false
        files: '^(scripts/(pseudonymize|sops_recipients|sops_paths|test_.*)\.py|\.sops\.yaml|\.pseudonyms\.yaml)$'

      # Rules whose absence has already cost real downtime on this boat. Each
      # one carries its incident in its docstring. Repo-only and CI-safe;
      # the host-state equivalents are scripts/lint_host_state.py, which needs
      # the machine and is run there by hand.
      #
      # The one that earns its place on its own: a .gitattributes filter that
      # git has no config for. Found unconfigured here on 2026-08-14, which is
      # the state in which a secret commits to a public repo in cleartext.
      - id: repo-hygiene
        name: repo hygiene (declared filters, alarm scope)
        entry: python3 scripts/lint_repo_hygiene.py
        language: system
        pass_filenames: false
        always_run: true

      # The boat Pi's locale has no codeset (LANG=en_US), so glibc falls back
      # to ISO-8859-1 and Python inherits it for file I/O. A script that opens
      # a UTF-8 document without an explicit encoding reads it as latin-1 and
      # writes latin-1 back, turning an em dash into mojibake in a committed
      # file. This catches the damage at the commit rather than in review.
      # Repo layer only -- the host and process checks need the machine.
      - id: encoding-health
        name: encoding (tracked files are UTF-8, no mojibake)
        entry: python3 scripts/check_encoding_health.py --repo
        language: system
        pass_filenames: false
        always_run: true

      # Cheap syntax gate. A config file that doesn't parse can strand the
      # boat's services on next restart, and it's the same check CI runs.
      - id: validate-configs
        name: JSON/YAML parse check
        entry: python3 scripts/validate_configs.py
        language: system
        pass_filenames: false
        files: '\.(json|ya?ml)$'
