# Bound the persistent journal. Nothing was capping it before this: with no
# SystemMaxUse, journald falls back to 10% of the filesystem (2.9 GB here) and
# the boat's root fs sat at 76% with 1.4 GB of journal in it.
#
# 1 GB is roughly 10.5 days of history at the measured 96-98 MB/day this box
# writes (byte-exact from two consecutive archived system journals,
# 2026-09-02). About 88% of that rate is openplotter-i2c-read.service, which
# polls the i2c sensors by way of a Restart=always/RestartSec=3 loop around a
# program that exits cleanly -- roughly 13.9 restarts/min, forever, by
# OpenPlotter's design. Do not "fix" that service; it is how the BME680 and
# the other i2c sensors are read. It does mean the rate has a fixed floor, so
# the cap is the only lever. If the dedicated BME680 plugin ever takes that
# job over, the floor drops and this can shrink.
#
# Rate before 2026-09-02 was ~278 MB/day; the other ~182 MB/day was
# pypilot_web crash-looping under uid 1000 (see host/pypilot-web).
# Pi OS Trixie ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# (Storage=volatile), so on a HALOS card nothing survives a reboot and a hang is
# undiagnosable -- the bench card wedged for 3.5 h on 2026-09-03 and left no
# trace. Bookworm on the boat card is already persistent; this is a no-op there.
[Journal]
Storage=persistent
SystemMaxUse=1G
