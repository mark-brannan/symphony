# Symphony's override for HALOS's marine-signalk-server-container compose file.
# Stock HALOS healthcheck: 60 s start period, then 3 probes 30 s apart (150 s
# in all). A 120-plugin config takes 3–4 min, and autoheal restarts the
# container before it finishes starting.
services:
  signalk-server:
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/signalk || exit 1"]
      interval: 30s
      timeout: 30s
      start_period: 900s
      retries: 3
