# Hardware watchdog. The BCM2835 timer resets the board if systemd stops
# petting it, which covers the class of hang where the Pi stops answering
# both ping and SSH. Before this, recovery meant someone aboard pulling the
# power — no good when nobody's on the boat (2026-08-12).
#
# 60s, raised from 15s on 2026-08-13. At 15s it fired twice in 33 minutes on
# a notification storm the box would have recovered from on its own, and a
# hard reset is not free: it risks SD corruption, and one landing on an
# `npm install` wrecked the plugin tree once already. 60s rides out transient
# starvation and still self-heals a real wedge well inside a trip to the
# marina.
#
# 15s is the bcm2835 hardware heartbeat, not a ceiling on this setting — the
# kernel watchdog core pets the hardware itself and enforces the longer
# timeout in software. Verified at 60s: /sys/class/watchdog/watchdog0/timeout
# reads 60 and systemd logs "hardware timeout of 1min".
#
# systemd pings at half the interval. RebootWatchdogSec catches a reboot that
# itself wedges partway.
#
# This does not catch a hung service while systemd keeps running — SignalK
# wedging on its own needs a separate service-level check.
[Manager]
RuntimeWatchdogSec=60
RebootWatchdogSec=2min
