# Point pypilot_web.service at host/pypilot-web instead of pypilot's own
# `pypilot_web` entry point. See the comment at the top of host/pypilot-web:
# the shipped entry point passes allow_unsafe_werkzeug=True into a gevent
# WSGIServer, which makes the server accept connections and then fail every
# one of them in wrap_socket(). The empty ExecStart= clears the unit's own
# line; without it systemd appends rather than replaces.
[Service]
ExecStart=
ExecStart=/usr/local/bin/pypilot-web 8000
