# Order SignalK after bluetoothd owns its bus name.
#
# bt-sensors-plugin-sk opens a D-Bus connection to org.bluez as it loads. With
# no ordering against bluetooth.service, a boot can start SignalK first: the
# plugin's handshake dies with `write EPIPE`, it does not retry, and every BLE
# sensor stays silent until someone restarts SignalK by hand. Observed on the
# 2026-08-13 18:15 boot — the house batteries published nothing until a manual
# restart. That matters because the hardware watchdog exists to reboot this box
# when nobody is aboard, so an unattended reboot would otherwise come back
# without BLE telemetry.
#
# After= alone is enough here. bluetooth.service is Type=dbus with
# BusName=org.bluez, so systemd does not consider it started until the name is
# actually claimed — which is the condition the plugin needs, not merely that
# the process was forked.
#
# Wants=, deliberately not Requires=: a radio that fails to come up should cost
# the BLE sensors, not the whole SignalK stack.
[Unit]
After=bluetooth.service
Wants=bluetooth.service
