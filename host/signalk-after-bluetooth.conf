# Order SignalK after bluetoothd owns its bus name.
#
# This is correct ordering for a server whose bt-sensors-plugin-sk talks to
# org.bluez, and it costs nothing. Keep it. But do not expect it to fix the
# D-Bus handshake failure described in RUNBOOK.md ("BLE sensors silent
# after a reboot") — it was written to fix exactly that and did not.
#
# Measured on the 2026-08-13 18:35 boot, with this drop-in already active:
# bluetooth.service reached 'Started' at 18:35:15, SignalK started after it,
# the plugin loaded at 18:36:55, and its dbus-next handshake still died at
# 18:37:15 — roughly a hundred seconds after bluetoothd had claimed the bus.
# So the failure is not a boot race, and ordering cannot address it.
#
# After= would be sufficient if it were a race: bluetooth.service is Type=dbus
# with BusName=org.bluez, so systemd holds it 'activating' until the name is
# actually claimed, not merely until the process forks.
#
# Wants= rather than Requires=, so a radio that fails to appear costs the BLE
# sensors and not the whole SignalK stack.
[Unit]
After=bluetooth.service
Wants=bluetooth.service
