# Time from the boat's GPS. Drop-in; Debian's own /etc/chrony/chrony.conf
# still supplies the NTP pool, the driftfile, and the rest.
#
# The Pi 4B has no RTC, so the clock is wrong at every boot and stays wrong
# whenever the boat is offline. That breaks more than log timestamps: TLS
# certificate validity and Dex's OIDC token iat/exp are both time-based, so a
# bad clock makes SSO fail with errors that point anywhere but here. InfluxDB
# is the other half — points land at the wrong time, and a 720h retention
# will happily drop data that only looks old.

# gpsd already publishes NMEA time into shared memory (visible in `ipcs -m`
# as keys 0x4e545030..34, i.e. NTP0..NTP4). Segments 0 and 1 are mode 0600
# root; 2 and 3 are 0666 for daemons that drop privileges, which Debian's
# chronyd does — it runs as _chrony. Hence segment 2.
#
# NMEA time over a serial line is coarse: tens of milliseconds, varying with
# sentence length and baud. Good enough for timestamps and certificate
# validity, not for anything needing real precision. It is a fallback for
# when the boat is offline, not a better clock than the internet.
refclock SHM 2 refid GPS precision 1e-1 offset 0.0 delay 0.2

# With no RTC the clock can be years off at boot. Allow chronyd to step it by
# any amount at any time, not just during the first few updates — otherwise
# it slews, and a large offset takes hours to correct.
makestep 1.0 -1

# Serve time to the rest of the boat, so chartplotters and tablets with no
# internet follow the GPS too. This is what makes signalk-ntp-server
# unnecessary.
allow 192.168.8.0/24
allow 10.42.0.0/24
