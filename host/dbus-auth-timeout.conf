<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Give a client longer than 30s to finish authenticating to the system bus.

  Note for editors: XML forbids a double hyphen inside a comment, so this
  block uses single hyphens where the rest of host/ would use a long dash.
  dbus-daemon rejects the whole file on a parse error and keeps its previous
  config, so a slip here is loud rather than silent.

  bt-sensors-plugin-sk opens its org.bluez connection at require() time
  (index.js: createBluetooth() at module scope), which is during SignalK's
  plugin-load sweep. dbus-next runs the auth handshake from the socket's
  'connect' callback, and that callback does not get dispatched until the
  event loop drains - roughly 45s on this box, because loading the rest of
  the plugins is synchronous. dbus-daemon closes the still-unauthenticated
  socket at auth_timeout, and the handshake's first write then lands on a
  dead socket:

      dbus-daemon: Connection has not authenticated soon enough, closing it
                   (auth_timeout=30000ms, elapsed: 30000ms)
      signalk-server: Uncaught exception: Error: write EPIPE
                        at auth (.../dbus-next/lib/handshake.js:67)

  The plugin never retries, so the bus stays dead for the life of the process
  and no electrical.batteries.* is ever published. Restarting SignalK does not
  clear it: every start blocks the loop the same way, which is why
  signalk-ble-check spends its whole restart budget each boot and gives up.

  This is a workaround at the wrong layer. The fix is for the plugin to open
  the bus lazily and reconnect on error. But it is one file, it is reversible,
  and it restores battery monitoring without waiting on a plugin release.
  Remove it once the plugin is fixed.

  Do not read this as a fix for a boot-ordering race. It is not one:
  bluetoothd owns the bus long before SignalK loads. See RUNBOOK ->
  "BLE sensors go silent after a reboot".

  /etc/dbus-1/system-local.conf is included last by the shipped
  /usr/share/dbus-1/system.conf, so a limit set here overrides the default
  rather than racing it.
-->
<busconfig>
  <limit name="auth_timeout">120000</limit>
</busconfig>
