// Boat-specific limits on unattended-upgrades. Overrides the stock
// 50unattended-upgrades; a higher-numbered file wins.
//
// The stock config already restricts itself to the security archive, which is
// what we want — this box should get security fixes without anyone driving to
// the marina, and nothing else on a schedule.

// Never upgrade these unattended, whatever the archive says.
//
// Node and the SignalK server are the two packages whose upgrade has actually
// broken this boat. A Node major bump invalidates every compiled native module
// in ~/.signalk, and rebuilding them takes ~30 minutes of the Pi's full
// attention and has failed outright before. signalk-server is pinned by an
// OpenPlotter launcher script that names its install directory by absolute
// path, so an upgrade can land in a directory nothing reads and look like
// nothing happened (2026-08-11).
//
// bluez and the kernel are here for a narrower reason: the BLE controller's
// firmware patch only reloads at boot, and a BLE stack that changes underneath
// a running bt-sensors plugin is difficult to tell apart from a hardware
// fault. Upgrade those deliberately, with someone watching.
Unattended-Upgrade::Package-Blacklist {
	"nodejs";
	"signalk-server";
	"bluez";
	"linux-image-";
	"raspberrypi-kernel";
	"^openplotter-";
};

// Do not reboot on its own, ever. The Pi is powered from the N2K bus with no
// buffer, the plugin tree has already been destroyed once by a reboot landing
// mid-install, and nothing aboard would bring the box back if it failed to
// come up. A pending-reboot flag that someone acts on beats a boat that
// rebooted itself at 3 a.m.
Unattended-Upgrade::Automatic-Reboot "false";

// Mail would be the natural way to hear about this, but signalk-healthcheck
// has proven the box cannot send any (2026-08-13, no SMTP configured at all).
// Until that is fixed, the record is journald: `journalctl -u unattended-upgrades`
// and /var/log/unattended-upgrades/.
Unattended-Upgrade::MailReport "on-change";
