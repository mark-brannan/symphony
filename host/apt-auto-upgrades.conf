// Turn on unattended-upgrades. Without this file the package is installed and
// its timers run, but nothing is ever applied — the stock apt-daily timers
// refresh package lists and stop there. Installed 2026-08-13.
//
// The pairing matters: "1" on the first line downloads, "1" on the second is
// what actually installs. Setting only the first looks enabled and isn't.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";

// Clean the apt cache weekly. This box fills its SD card with cache rather
// than data — /var/cache/apt reached 2.4 GB once — and it boots from that card.
APT::Periodic::AutocleanInterval "7";
