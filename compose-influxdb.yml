services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    env_file:
      - .env
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    restart: unless-stopped
    networks:
      - symphony-net

volumes:
  influxdb-data:
  influxdb-config:
