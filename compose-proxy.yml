services:
  caddy:
    build: ./caddy
    container_name: caddy
    profiles: ["tls"]
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - symphony-net

volumes:
  caddy-data:
  caddy-config:
