# Vaultwarden, reachable only over the tailnet.
#
# Vaultwarden listens on 127.0.0.1 only. Tailscale runs on the host, not as a
# sidecar, and `tailscale serve` terminates HTTPS in front of it. Nothing is
# published on the LAN and nothing is on the internet. The host dials out to
# the tailnet, so it needs no inbound firewall rule and no public DNS name.
#
# This runs on a VPS, not on the boat and not on the house dev box. The vault
# holds the age key that opens this repo's secrets: if it lived on the boat,
# recovering a broken boat would require the boat. It also has to be reachable
# from wherever config is authored, independent of any one machine being up.
#
# The boat never calls this. Its `keys.txt` is a deployed artifact, pushed and
# verified like any other config.
#
# Its own config is deliberately NOT sops-encrypted -- restoring from a backup
# you can't open without the thing inside the backup is not a backup. `.env`
# stays plain and gitignored.
#
# --- Bring-up -------------------------------------------------------------
#  0. Stop any other stack pointed at the same data directory:
#       docker compose -f /home/solace/vaultwarden/docker-compose.yml down
#     Two vaultwarden processes on one SQLite file is how you corrupt the
#     vault, and it will not announce itself -- the second writer just wins.
#  1. On the host: install tailscale, `tailscale up`, then disable key expiry
#     for this node in the admin console. A node whose key expires goes
#     offline and needs an interactive re-auth.
#  2. Enable HTTPS certificates for the tailnet (admin console -> DNS ->
#     HTTPS Certificates). Without it there is no cert to serve, and the
#     Bitwarden web vault needs a secure context to do its crypto at all --
#     over plain http the unlock screen fails.
#  3. cp .env.example .env, fill in ADMIN_TOKEN and VW_DOMAIN. VW_DOMAIN is
#     the host's own MagicDNS name, since the cert belongs to the host rather
#     than to a per-service node:
#       tailscale status --json | jq -r '.Self.DNSName | rtrimstr(".")'
#  4. docker compose up -d
#  5. On the host:
#       tailscale serve --bg --https 443 http://127.0.0.1:8080
#  6. Browse to https://$VW_DOMAIN from any tailnet device.
#
# Verify with `tailscale serve status` on the host and `curl -sI
# http://127.0.0.1:8080` on the box -- the second one works here precisely
# because the port is published to loopback.
---
services:
  vaultwarden:
    image: ghcr.io/dani-garcia/vaultwarden:latest
    container_name: vaultwarden
    restart: unless-stopped
    # Loopback only. Dropping the 127.0.0.1 prefix binds all interfaces and
    # puts the vault on the LAN; that is the one edit to never make here.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      DOMAIN: https://${VW_DOMAIN:?set VW_DOMAIN in .env -- see bring-up above}
      # The account already exists. Leave signups off; use the admin page if
      # another one is ever needed.
      SIGNUPS_ALLOWED: "false"
      ROCKET_PORT: "8080"
    volumes:
      # Points outside the repo on purpose -- this is the live vault, not
      # configuration. Keep it wherever it already lives; the compose file is
      # what moves between hosts.
      - ${VAULTWARDEN_DATA:-/home/solace/vaultwarden/data}:/data
