services:
  signalk:
    image: signalk/signalk-server:latest
    container_name: signalk-server
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./signalk:/home/node/.signalk
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: "service:vcan"
    group_add:
      - "1001" # host's docker GID, for docker.sock access (getent group docker)
    #devices:
      #- "/dev/ttyUSB0:/dev/ttyUSB0"
      #- "/dev/ttyAMA0:/dev/ttyAMA0" # Maps the GPIO UART for NMEA 0183
    cap_add:
      - NET_ADMIN # Allows the container to interact with network configurations if needed
    depends_on:
      - influxdb
      - vcan

  # Owns the network namespace signalk runs in, so it can create a can0 there:
  # the signalk image has no iproute2 and runs as uid 1000. With can0 present,
  # the dev box matches the boat's NMEA 2000 provider verbatim and neither
  # settings.json nor signalk-healthcheck.json needs a dev variant.
  vcan:
    image: alpine:3.20
    container_name: signalk-vcan
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "3000:3000"
      - "80:80"
    networks:
      - symphony-net
    command: >
      sh -c "apk add --no-cache iproute2 >/dev/null &&
             ip link add dev can0 type vcan &&
             ip link set up can0 &&
             exec sleep infinity"
