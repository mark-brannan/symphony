services:
  signalk:
    image: signalk/signalk-server:latest
    container_name: signalk-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3001:3000" # Map to external port 3001 to avoid conflict with grafana
      - "80:80"
    volumes:
      - ./signalk:/home/node/.signalk
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/solace/signalk-lint:/opt/dev-plugins/signalk-lint:ro
    networks:
      - symphony-net
    group_add:
      - "1001" # host's docker GID, for docker.sock access (getent group docker)
    #devices:
      #- "/dev/ttyUSB0:/dev/ttyUSB0"
      #- "/dev/ttyAMA0:/dev/ttyAMA0" # Maps the GPIO UART for NMEA 0183
    cap_add:
      - NET_ADMIN # Allows the container to interact with network configurations if needed
    depends_on:
      - influxdb
