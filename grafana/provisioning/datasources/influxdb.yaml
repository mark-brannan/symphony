apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    # Every provisioned dashboard names this uid -- 162 panel references across
    # the five JSON files. Without it Grafana assigns a random one at startup
    # and the dashboards come up empty, which reads as "no data" rather than as
    # a wiring fault.
    uid: influxdb-symphony
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: darkstarllc
      defaultBucket: symphony
    secureJsonData:
      token: $INFLUX_TOKEN
    isDefault: true
    editable: true

