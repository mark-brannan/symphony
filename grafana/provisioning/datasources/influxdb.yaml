apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    # Fixed rather than assigned at startup so anything that names this uid
    # keeps working across restarts.
    #
    # The provisioned dashboards no longer read this datasource -- they are
    # QuestDB SQL now (scripts/build_dashboards.py) and name the QuestDB
    # datasource's uid. `version: Flux` stays because ad-hoc exploration of
    # this InfluxDB 2.x bucket needs it: left in the default InfluxQL mode,
    # a Flux query returns nothing, with no error anywhere.
    uid: influxdb-symphony
    access: proxy
    # Not hardcoded to the compose service name, because during the move off
    # systemd the two sides land at different times: a containerized Grafana
    # reaching an InfluxDB that is still a native service needs
    # http://host.docker.internal:8086, and the compose service needs
    # http://influxdb:8086. Set INFLUX_URL in .env to whichever is true today;
    # nothing else has to change when the other side moves.
    url: $INFLUX_URL
    jsonData:
      version: Flux
      organization: $INFLUX_ORG
      defaultBucket: $INFLUX_BUCKET
    secureJsonData:
      token: $INFLUX_TOKEN
    isDefault: true
    editable: true

