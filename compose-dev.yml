# Dev-box-only overrides. Opt-in: the name keeps compose from auto-loading it.
# Use it with an explicit -f:
#   docker compose -f docker-compose.yml -f compose-dev.yml up -d signalk
#
# The boat runs SignalK natively, not in Docker (reference/software_stack.md
# "The boat Pi runs none of this in Docker"), so nothing here can reach it.
# Even so, it is not auto-loaded, so a boat checkout never picks it up.
#
# What it does: pins a few plugin configs to dev values by mounting a
# replacement file over the repo's copy, so signalk/plugin-config-data/ stays
# exactly what we intend to push to the boat. See
# dev/plugin-config-overrides/README.md.

services:
  signalk:
    volumes:
      - ./dev/plugin-config-overrides/signalk-pushover-notification-relay.json:/home/node/.signalk/plugin-config-data/signalk-pushover-notification-relay.json:ro
