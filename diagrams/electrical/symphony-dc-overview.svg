<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" font-family="Helvetica, Arial, sans-serif">
  <style>
    .lbl { font-size: 14px; fill: #1a202c; }
    .lbl-b { font-size: 14px; font-weight: bold; fill: #1a202c; }
    .sub { font-size: 11.5px; fill: #4a5568; }
    .fuse-lbl { font-size: 11px; font-weight: bold; fill: #7b5d00; }
    .pos { stroke: #cc2222; fill: none; }
    .neg { stroke: #111111; fill: none; }
    .ac  { stroke: #2e8b57; fill: none; }
    .data { stroke: #2b6cb0; fill: none; }
    .planned { stroke-dasharray: 6 4; }
  </style>

  <rect x="0" y="0" width="1440" height="920" fill="#ffffff"/>
  <text x="40" y="48" font-size="24" font-weight="bold" fill="#1a202c">SV Symphony — 12V DC system (draft)</text>

  <!-- ===== Starter circuit ===== -->
  <rect x="60" y="120" width="160" height="60" fill="#fdebd0" stroke="#b9770e" stroke-width="1.5" rx="8"/>
  <text x="140" y="145" text-anchor="middle" class="lbl-b">Alternator</text>
  <text x="140" y="163" text-anchor="middle" class="sub">engine-driven</text>

  <rect x="60" y="260" width="160" height="80" fill="#e8eef7" stroke="#5b7ea8" stroke-width="1.5" rx="4"/>
  <text x="140" y="292" text-anchor="middle" class="lbl-b">Starter battery</text>
  <text x="140" y="312" text-anchor="middle" class="sub">AGM Group 48R, 70Ah</text>

  <circle cx="140" cy="430" r="36" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="140" y="426" text-anchor="middle" class="sub">starter</text>
  <text x="140" y="440" text-anchor="middle" class="sub">switch</text>

  <rect x="60" y="498" width="160" height="50" fill="#f7f7f7" stroke="#888888" stroke-width="1.2" rx="8"/>
  <text x="140" y="528" text-anchor="middle" class="lbl">Engine starter</text>

  <path d="M140 180 V260" class="pos" stroke-width="3"/>
  <path d="M140 340 V394" class="pos" stroke-width="3"/>
  <path d="M140 466 V498" class="pos" stroke-width="3"/>

  <!-- ===== Orion DC-DC: starter -> house ===== -->
  <path d="M220 300 H240" class="pos" stroke-width="2.5"/>
  <rect x="240" y="289" width="44" height="22" fill="#fff3bf" stroke="#b08900" rx="3"/>
  <text x="262" y="304" text-anchor="middle" class="fuse-lbl">50A</text>
  <path d="M284 300 H300" class="pos" stroke-width="2.5"/>
  <rect x="300" y="270" width="200" height="60" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5" rx="8"/>
  <text x="400" y="294" text-anchor="middle" class="lbl-b">Orion-Tr 12/12 DC-DC</text>
  <text x="400" y="313" text-anchor="middle" class="sub">charger — model/rating TBD</text>
  <path d="M500 300 H540 V270" class="pos" stroke-width="2.5"/>

  <!-- ===== Switched house bus ===== -->
  <rect x="520" y="250" width="340" height="20" fill="#f5c6c6" stroke="#cc2222" stroke-width="1.5"/>
  <text x="690" y="244" text-anchor="middle" class="lbl-b" fill="#cc2222">+ house bus (switched)</text>

  <!-- Bus -> master switch -> junction -> Class T -> bank -->
  <path d="M710 270 V280" class="pos" stroke-width="4"/>
  <circle cx="710" cy="310" r="30" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="710" y="306" text-anchor="middle" class="sub">master</text>
  <text x="710" y="320" text-anchor="middle" class="sub">275A</text>
  <path d="M710 340 V404" class="pos" stroke-width="4"/>
  <circle cx="710" cy="378" r="4" fill="#cc2222"/>
  <rect x="683" y="404" width="54" height="26" fill="#fff3bf" stroke="#b08900" rx="3"/>
  <text x="710" y="415" text-anchor="middle" class="fuse-lbl">Class T</text>
  <text x="710" y="426" text-anchor="middle" class="fuse-lbl">125A</text>
  <path d="M710 430 V470" class="pos" stroke-width="4"/>

  <rect x="620" y="470" width="180" height="90" fill="#e6f4e6" stroke="#2f855a" stroke-width="2" rx="4"/>
  <text x="710" y="502" text-anchor="middle" class="lbl-b">House bank</text>
  <text x="710" y="521" text-anchor="middle" class="sub">LiFePO4 2×280Ah (560Ah)</text>
  <text x="710" y="537" text-anchor="middle" class="sub">internal BMS</text>

  <!-- ===== Unswitched distribution bus (battery side of master switch) ===== -->
  <path d="M710 378 H900" class="pos" stroke-width="3"/>
  <rect x="900" y="368" width="300" height="22" fill="#fbd9b5" stroke="#c05621" stroke-width="2"/>
  <text x="1050" y="360" text-anchor="middle" class="lbl-b" fill="#c05621">UNSWITCHED DISTRIBUTION BUS</text>

  <!-- Direct on unswitched bus: Cerbo + BatteryProtect only -->
  <path d="M980 390 V425" class="pos" stroke-width="2"/>
  <rect x="915" y="425" width="130" height="48" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5" rx="8"/>
  <text x="980" y="445" text-anchor="middle" class="lbl-b">Cerbo GX MK2</text>
  <text x="980" y="462" text-anchor="middle" class="sub">monitoring hub</text>

  <path d="M1130 390 V425" class="pos" stroke-width="2"/>
  <rect x="1055" y="425" width="150" height="48" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5" rx="8"/>
  <text x="1130" y="445" text-anchor="middle" class="lbl-b">BatteryProtect 65A</text>
  <text x="1130" y="462" text-anchor="middle" class="sub">load side TBD</text>

  <!-- Breaker -> always-on bus -->
  <path d="M1200 379 H1225 V410 H1248" class="pos" stroke-width="2.5"/>
  <circle cx="1225" cy="410" r="4" fill="#cc2222"/>
  <rect x="1248" y="392" width="72" height="36" fill="#fff3bf" stroke="#b08900" rx="3"/>
  <text x="1284" y="407" text-anchor="middle" class="fuse-lbl">breaker</text>
  <text x="1284" y="420" text-anchor="middle" class="fuse-lbl">size TBD</text>
  <path d="M1284 428 V440" class="pos" stroke-width="2.5"/>

  <rect x="1274" y="440" width="20" height="120" fill="#fbd9b5" stroke="#c05621" stroke-width="2"/>
  <text x="1430" y="434" text-anchor="end" class="lbl-b" fill="#c05621">always-on bus (pumps)</text>

  <path d="M1294 470 H1310" class="pos" stroke-width="2"/>
  <rect x="1310" y="445" width="120" height="50" fill="#fff9e6" stroke="#b08900" stroke-width="1.5" rx="8"/>
  <text x="1370" y="466" text-anchor="middle" class="lbl">Bilge pump</text>
  <text x="1370" y="483" text-anchor="middle" class="sub">auto, 7.5A</text>

  <path d="M1294 535 H1310" class="pos" stroke-width="2"/>
  <rect x="1310" y="510" width="120" height="50" fill="#fff9e6" stroke="#b08900" stroke-width="1.5" rx="8"/>
  <text x="1370" y="531" text-anchor="middle" class="lbl">Crash pumps</text>
  <text x="1370" y="548" text-anchor="middle" class="sub">25A ea, qty TBD</text>

  <!-- Low current unswitched: own breaker + bus -->
  <path d="M1225 410 V570" class="pos" stroke-width="2.5"/>
  <rect x="1189" y="570" width="72" height="36" fill="#fff3bf" stroke="#b08900" rx="3"/>
  <text x="1225" y="585" text-anchor="middle" class="fuse-lbl">breaker</text>
  <text x="1225" y="598" text-anchor="middle" class="fuse-lbl">size TBD</text>
  <path d="M1225 606 V630" class="pos" stroke-width="2.5"/>
  <rect x="1150" y="630" width="230" height="20" fill="#fbd9b5" stroke="#c05621" stroke-width="2"/>
  <text x="1265" y="644" text-anchor="middle" font-size="11" font-weight="bold" fill="#c05621">LOW CURRENT UNSWITCHED</text>

  <rect x="880" y="615" width="128" height="58" fill="#f7f7f7" stroke="#888888" stroke-width="1.2" rx="8" stroke-dasharray="6 4"/>
  <text x="944" y="632" text-anchor="middle" font-size="10.5" fill="#4a5568">AIS · router/modem</text>
  <text x="944" y="647" text-anchor="middle" font-size="10.5" fill="#4a5568">smoke/CO/LPG detectors</text>
  <text x="944" y="662" text-anchor="middle" font-size="10.5" fill="#4a5568">(space reserved)</text>
  <path d="M1008 640 H1150" class="pos" stroke-width="2"/>

  <path d="M1300 650 V680" class="pos" stroke-width="2"/>
  <rect x="1281" y="654" width="38" height="18" fill="#fff3bf" stroke="#b08900" rx="3"/>
  <text x="1300" y="667" text-anchor="middle" class="fuse-lbl">3A</text>

  <!-- ===== Negative side ===== -->
  <path d="M800 517 H860" class="neg" stroke-width="4"/>
  <rect x="860" y="495" width="130" height="44" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5" rx="8"/>
  <text x="925" y="513" text-anchor="middle" class="lbl">SmartShunt IP65</text>
  <text x="925" y="529" text-anchor="middle" class="sub">battery monitor</text>
  <path d="M990 517 H1030" class="neg" stroke-width="4"/>
  <rect x="1030" y="505" width="170" height="24" fill="#e2e2e2" stroke="#111111" stroke-width="1.5"/>
  <text x="1115" y="521" text-anchor="middle" class="lbl-b">− bus</text>
  <text x="1115" y="548" text-anchor="middle" class="sub">(all load negatives return here)</text>

  <!-- ===== AC side ===== -->
  <rect x="940" y="60" width="180" height="50" fill="#dff0e3" stroke="#2e8b57" stroke-width="1.5" rx="8"/>
  <text x="1030" y="81" text-anchor="middle" class="lbl-b">Shore power inlet</text>
  <text x="1030" y="98" text-anchor="middle" class="sub">120V AC, 30A</text>
  <path d="M1030 110 V138" class="ac" stroke-width="2.5"/>

  <rect x="940" y="138" width="180" height="50" fill="#dff0e3" stroke="#2e8b57" stroke-width="1.5" rx="8"/>
  <text x="1030" y="159" text-anchor="middle" class="lbl-b">Isolation transformer</text>
  <text x="1030" y="176" text-anchor="middle" class="sub">3600W 115/230V</text>
  <path d="M1030 188 V220" class="ac" stroke-width="2.5"/>
  <text x="1040" y="210" class="sub" fill="#2e8b57">AC in</text>

  <rect x="960" y="220" width="200" height="70" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5" rx="8"/>
  <text x="1060" y="247" text-anchor="middle" class="lbl-b">MultiPlus 500VA</text>
  <text x="1060" y="266" text-anchor="middle" class="sub">Victron inverter-charger</text>

  <path d="M1160 255 H1220" class="ac" stroke-width="2.5"/>
  <text x="1172" y="248" class="sub" fill="#2e8b57">AC out</text>
  <rect x="1220" y="225" width="160" height="60" fill="#dff0e3" stroke="#2e8b57" stroke-width="1.5" rx="8"/>
  <text x="1300" y="250" text-anchor="middle" class="lbl-b">AC panel</text>
  <text x="1300" y="268" text-anchor="middle" class="sub">outlets, water heater</text>

  <path d="M1120 163 H1400 V345 H1380" class="ac" stroke-width="2"/>
  <text x="1128" y="156" class="sub" fill="#2e8b57">shore-only AC — never on inverter</text>
  <rect x="1220" y="315" width="160" height="60" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5" rx="8"/>
  <text x="1300" y="335" text-anchor="middle" class="lbl-b">Blue Smart IP22 12/30</text>
  <text x="1300" y="351" text-anchor="middle" class="sub">AGM starter charger</text>
  <text x="1300" y="366" text-anchor="middle" class="sub">+ other chargers TBD</text>
  <path d="M1220 345 H1180" class="pos" stroke-width="2"/>
  <text x="1175" y="340" text-anchor="end" class="sub" fill="#cc2222">to starter battery</text>

  <!-- MultiPlus DC side -->
  <path d="M960 260 H936" class="pos" stroke-width="3"/>
  <rect x="880" y="247" width="56" height="26" fill="#fff3bf" stroke="#b08900" rx="3"/>
  <text x="908" y="264" text-anchor="middle" class="fuse-lbl">60A</text>
  <path d="M880 260 H860" class="pos" stroke-width="3"/>

  <!-- ===== DC panel + loads ===== -->
  <path d="M590 270 V560" class="pos" stroke-width="3"/>
  <rect x="140" y="560" width="760" height="50" fill="#fdebd0" stroke="#b9770e" stroke-width="1.5" rx="4"/>
  <text x="520" y="590" text-anchor="middle" class="lbl-b">DC distribution panel (breakers)</text>

  <g>
    <rect x="150" y="680" width="100" height="55" fill="#f7f7f7" stroke="#888888" rx="8"/>
    <text x="200" y="703" text-anchor="middle" class="lbl">Nav lights</text>
    <text x="200" y="720" text-anchor="middle" class="sub">4A, 14 AWG</text>
    <path d="M200 610 V680" class="pos" stroke-width="1.8"/>

    <rect x="260" y="680" width="100" height="55" fill="#f7f7f7" stroke="#888888" rx="8"/>
    <text x="310" y="703" text-anchor="middle" class="lbl">Cabin lights</text>
    <text x="310" y="720" text-anchor="middle" class="sub">5A, 18 AWG</text>
    <path d="M310 610 V680" class="pos" stroke-width="1.8"/>

    <rect x="370" y="680" width="100" height="55" fill="#f7f7f7" stroke="#888888" rx="8"/>
    <text x="420" y="703" text-anchor="middle" class="lbl">Refrigeration</text>
    <text x="420" y="720" text-anchor="middle" class="sub">7.5A, 14 AWG</text>
    <path d="M420 610 V680" class="pos" stroke-width="1.8"/>

    <rect x="480" y="680" width="100" height="55" fill="#f7f7f7" stroke="#888888" rx="8"/>
    <text x="530" y="703" text-anchor="middle" class="lbl">VHF radio</text>
    <text x="530" y="720" text-anchor="middle" class="sub">7.5A, 12 AWG</text>
    <path d="M530 610 V680" class="pos" stroke-width="1.8"/>

    <rect x="590" y="680" width="100" height="55" fill="#f7f7f7" stroke="#888888" rx="8"/>
    <text x="640" y="703" text-anchor="middle" class="lbl">Autopilot</text>
    <text x="640" y="720" text-anchor="middle" class="sub">10A, 10 AWG</text>
    <path d="M640 610 V680" class="pos" stroke-width="1.8"/>

    <rect x="700" y="680" width="100" height="55" fill="#f7f7f7" stroke="#888888" rx="8"/>
    <text x="750" y="703" text-anchor="middle" class="lbl">Water pump</text>
    <text x="750" y="720" text-anchor="middle" class="sub">10A, 16 AWG</text>
    <path d="M750 610 V680" class="pos" stroke-width="1.8"/>

    <rect x="810" y="680" width="100" height="55" fill="#f7f7f7" stroke="#888888" rx="8"/>
    <text x="860" y="703" text-anchor="middle" class="lbl">Shower sump</text>
    <text x="860" y="720" text-anchor="middle" class="sub">4A, 18 AWG</text>
    <path d="M860 610 V680" class="pos" stroke-width="1.8"/>
  </g>

  <!-- ===== NMEA 2000 + SignalK ===== -->
  <rect x="940" y="680" width="420" height="24" fill="#dbe7f8" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="1150" y="697" text-anchor="middle" class="lbl-b" fill="#2b6cb0">NMEA 2000 backbone (12V power tap)</text>

  <!-- Cerbo data: VE.Direct from shunt, N2K to backbone -->
  <path d="M925 495 V481 H980 V473" class="data" stroke-width="2"/>
  <text x="930" y="490" class="sub" fill="#2b6cb0">VE.Direct</text>
  <path d="M1012 473 V680" class="data" stroke-width="2"/>

  <rect x="940" y="760" width="150" height="70" fill="#efe6f5" stroke="#8e5aa8" stroke-width="1.5" rx="8"/>
  <text x="1015" y="786" text-anchor="middle" class="lbl-b">SignalK server</text>
  <text x="1015" y="804" text-anchor="middle" class="sub">Raspberry Pi,</text>
  <text x="1015" y="818" text-anchor="middle" class="sub">N2K-powered</text>
  <path d="M1000 704 V760" class="data" stroke-width="2.5"/>

  <rect x="1120" y="760" width="120" height="70" fill="#efe6f5" stroke="#8e5aa8" stroke-width="1.5" rx="8" stroke-dasharray="6 4"/>
  <text x="1180" y="790" text-anchor="middle" class="lbl">SensESP</text>
  <text x="1180" y="806" text-anchor="middle" class="sub">planned</text>
  <path d="M1120 795 H1090" class="data planned" stroke-width="2"/>
  <text x="1093" y="788" class="sub" fill="#2b6cb0">WiFi</text>

  <rect x="1270" y="760" width="150" height="70" fill="#efe6f5" stroke="#8e5aa8" stroke-width="1.5" rx="8" stroke-dasharray="6 4"/>
  <text x="1345" y="784" text-anchor="middle" class="lbl">Digital switching</text>
  <text x="1345" y="800" text-anchor="middle" class="sub">nav / cabin lights</text>
  <text x="1345" y="814" text-anchor="middle" class="sub">planned</text>
  <path d="M1345 704 V760" class="data planned" stroke-width="2"/>

  <!-- Legend -->
  <rect x="40" y="765" width="250" height="122" fill="#fafafa" stroke="#bbbbbb" rx="6"/>
  <line x1="55" y1="787" x2="95" y2="787" class="pos" stroke-width="3"/>
  <text x="105" y="791" class="sub">DC positive</text>
  <line x1="55" y1="809" x2="95" y2="809" class="neg" stroke-width="3"/>
  <text x="105" y="813" class="sub">DC negative</text>
  <line x1="55" y1="831" x2="95" y2="831" class="ac" stroke-width="3"/>
  <text x="105" y="835" class="sub">AC 120V</text>
  <line x1="55" y1="853" x2="95" y2="853" class="data" stroke-width="3"/>
  <text x="105" y="857" class="sub">Data (NMEA 2000 / VE.Direct)</text>
  <line x1="55" y1="875" x2="95" y2="875" class="data planned" stroke-width="2"/>
  <text x="105" y="879" class="sub">Planned / future</text>
</svg>
