<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='940' viewBox='0 0 1280 940'><rect x='0' y='0' width='1280' height='940' rx='0' fill='#ffffff' stroke='#ffffff' stroke-width='0'/><text x='30' y='40' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='21' font-weight='bold' text-anchor='start' fill='#1a1a1a'>Variant 3 — counter-example: mechanical DPDT float switch, no isolation device</text><text x='30' y='63' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='13.5' font-weight='normal' text-anchor='start' fill='#5f6368'>Fewest active parts, but it spends the Run B length carrying a dry-circuit signal and gives up the SEAFLO kit's 3 s debounce.</text><g transform='translate(0,70)'><rect x='200' y='410' width='300' height='200' rx='6' fill='#e3f2fd' stroke='#bbdefb' stroke-width='1.5' stroke-dasharray='6 4'/><text x='210' y='601' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='bold' text-anchor='start' fill='#4a7fb5'>IN THE BILGE</text><polyline points='40,70 170,70' fill='none' stroke='#c62828' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><text x='30' y='18' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#5f6368'>from unswitched, always-on fused distribution</text><rect x='80' y='57' width='56' height='26' rx='3' fill='#ffffff' stroke='#c62828' stroke-width='2.2'/><polyline points='88,70 98,64 110,76 120,70 128,70' fill='none' stroke='#c62828' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><text x='108' y='104' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' text-anchor='middle' fill='#c62828'>FUSE 1 A</text><polyline points='170,70 170,470 240,470' fill='none' stroke='#c62828' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='40,650 640,650' fill='none' stroke='#212121' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><text x='30' y='674' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#5f6368'>to DC negative bus</text><rect x='240' y='440' width='220' height='120' rx='5' fill='#ffffff' stroke='#1a1a1a' stroke-width='2.4'/><text x='350' y='470' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='13.5' font-weight='bold' text-anchor='middle' fill='#1a1a1a'>DPDT FLOAT SWITCH</text><text x='350' y='490' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>two mechanically ganged,</text><text x='350' y='505' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>electrically separate poles</text><text x='350' y='528' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' text-anchor='middle' fill='#c62828'>no debounce — chatters in a seaway</text><circle cx='240' cy='470' r='4' fill='#ffffff' stroke='#c62828' stroke-width='2'/><text x='234' y='458' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='end' fill='#c62828'>P1 COM</text><circle cx='300' cy='440' r='4' fill='#ffffff' stroke='#e07000' stroke-width='2'/><text x='292' y='434' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='end' fill='#e07000'>P1 NO</text><circle cx='390' cy='440' r='4' fill='#ffffff' stroke='#1565c0' stroke-width='2'/><text x='398' y='434' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1565c0'>P2 a</text><circle cx='440' cy='440' r='4' fill='#ffffff' stroke='#1565c0' stroke-width='2'/><text x='448' y='434' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1565c0'>P2 b</text><polyline points='300,440 300,300 640,300' fill='none' stroke='#e07000' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><text x='312' y='288' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#e07000'>switched +12 V</text><polyline points='570,300 570,380' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='570,450 570,650' fill='none' stroke='#212121' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='570' cy='300' r='4.5' fill='#e07000'/><circle cx='570' cy='650' r='4.5' fill='#212121'/><rect x='500' y='380' width='140' height='70' rx='5' fill='#ffffff' stroke='#1a1a1a' stroke-width='2.4'/><text x='570' y='408' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' text-anchor='middle' fill='#1a1a1a'>PIEZO ALARM</text><text x='570' y='426' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>SEAFLO 95 dB, 12 V</text><text x='570' y='441' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>&lt; 60 mA</text><polyline points='390,440 390,309' fill='none' stroke='#1565c0' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M 390,309 A 9,9 0 0 0 390,291' fill='none' stroke='#1565c0' stroke-width='2.6'/><polyline points='390,291 390,208 950,208 950,400 980,400' fill='none' stroke='#1565c0' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='440,440 440,309' fill='none' stroke='#1565c0' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M 440,309 A 9,9 0 0 0 440,291' fill='none' stroke='#1565c0' stroke-width='2.6'/><polyline points='440,291 440,232 918,232 918,480 980,480' fill='none' stroke='#1565c0' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><text x='430' y='196' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='start' fill='#1565c0'>potential-free pair — run as its own twisted pair, 20–16 AWG, not bundled with the 12 V legs</text><rect x='980' y='340' width='190' height='200' rx='5' fill='#ffffff' stroke='#1565c0' stroke-width='2.4'/><text x='1075' y='368' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='13.5' font-weight='bold' text-anchor='middle' fill='#1565c0'>CERBO GX MK2</text><text x='1075' y='386' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>digital input block</text><text x='1075' y='420' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>3V3 via 10 kΩ pull-up</text><text x='1075' y='436' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>pull LOW to trigger</text><text x='1075' y='452' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>0.33 mA · NOT isolated</text><circle cx='980' cy='400' r='4' fill='#ffffff' stroke='#1565c0' stroke-width='2'/><text x='992' y='395' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1565c0'>DI n</text><circle cx='980' cy='480' r='4' fill='#ffffff' stroke='#1565c0' stroke-width='2'/><text x='992' y='475' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1565c0'>GND</text><text x='1075' y='562' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368' font-style='italic'>true dry contact</text><polyline points='202,300 196,300 196,440 202,440' fill='none' stroke='#5f6368' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='188' y='374' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='end' fill='#5f6368'></text><text x='160' y='336' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='end' fill='#5f6368'>Run B: 1–3 m</text><text x='160' y='352' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='end' fill='#5f6368'>4-cond 16 AWG</text><polyline points='145,52 145,46 170,46 170,52' fill='none' stroke='#5f6368' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='157.5' y='38' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='middle' fill='#5f6368'>Run A — 1–3 m</text><text x='30' y='690' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='start' fill='#1a1a1a'>TRADE-OFFS:  no relay, no optocoupler, no shared node between the 12 V and the signal side — the two poles are physically separate metal.</text><text x='30' y='708' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='start' fill='#1a1a1a'>Against it: the P2 contact is the same dry-circuit problem as Variant 2 (a float switch's contacts are silver, not gold), it has moving parts in a dirty bilge,</text><text x='30' y='726' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='start' fill='#1a1a1a'>and losing the 3 s delay means bilge slop toggles the alarm and the digital input together. Use only if a DPDT float switch is already the plan.</text><polyline points='960,40 986,40' fill='none' stroke='#c62828' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/><text x='993' y='44.5' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>+12 V, always-on fused feed</text><polyline points='960,59 986,59' fill='none' stroke='#212121' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/><text x='993' y='63.5' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>negative</text><polyline points='960,78 986,78' fill='none' stroke='#e07000' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/><text x='993' y='82.5' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>switched 12 V (hot only during alarm)</text><polyline points='960,97 986,97' fill='none' stroke='#1565c0' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/><text x='993' y='101.5' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>isolated signal side</text></g><polyline points='30,840 1250,840' fill='none' stroke='#dddddd' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/><text x='30' y='862' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#5f6368'>Fuse 1 A ATC/ATO  ·  all power conductors 16 AWG tinned, 105 °C  ·  ampacity 25 A outside engine space, 21 A inside (×0.85)</text><text x='30' y='880' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#5f6368'>Design load ≤ 0.25 A  ·  worst case 6 m one-way = 39 ft round trip → 0.04 V drop (0.3 %)  ·  16 AWG holds 3 % to ~345 ft round trip</text><text x='30' y='898' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#5f6368'>Gauge is set by the ABYC 16 AWG minimum, not by ampacity or voltage drop: no gauge change anywhere in the 1–3 m range.</text></svg>