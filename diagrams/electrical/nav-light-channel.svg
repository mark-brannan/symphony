, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>the ESP32 boots or resets</text><polyline points='260,714 260,830' fill='none' stroke='#1565c0' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='260' cy='830' r='4.5' fill='#212121'/><polyline points='340,530 310,530 310,830' fill='none' stroke='#1565c0' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='310' cy='830' r='4.5' fill='#212121'/><rect x='70' y='650' width='180' height='160' rx='6' fill='#f3f7fd' stroke='#1565c0' stroke-width='2.4'/><text x='160' y='690' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' text-anchor='middle' fill='#1565c0'>ESP32</text><text x='160' y='712' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='middle' fill='#5f6368'>one GPIO</text><text x='160' y='730' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='middle' fill='#5f6368'>per channel</text><text x='160' y='756' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#1a1a1a'>HIGH = light on</text><polyline points='250,780 310,780' fill='none' stroke='#212121' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='310' cy='780' r='4.5' fill='#212121'/><rect x='40' y='500' width='120' height='90' rx='5' fill='#ffffff' stroke='#c62828' stroke-width='2.2'/><text x='100' y='538' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='middle' fill='#1a1a1a'>12 V → 5 V</text><text x='100' y='556' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='middle' fill='#1a1a1a'>buck</text><text x='100' y='574' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' text-anchor='middle' fill='#5f6368'>shared ground</text><polyline points='100,500 100,444' fill='none' stroke='#c62828' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><rect x='85' y='396' width='30' height='48' rx='3' fill='#ffffff' stroke='#c62828' stroke-width='2.2'/><polyline points='100,396 100,444' fill='none' stroke='#c62828' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/><text x='78' y='421' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='bold' text-anchor='end' fill='#1a1a1a'>F-LOGIC</text><text x='78' y='437' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='end' fill='#5f6368'>1 A</text><polyline points='100,396 100,150' fill='none' stroke='#c62828' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='100' cy='150' r='4.5' fill='#c62828'/><polyline points='140,590 140,650' fill='none' stroke='#c62828' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='55,590 55,830' fill='none' stroke='#212121' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='55' cy='830' r='4.5' fill='#212121'/><polyline points='720,150 720,226' fill='none' stroke='#2e7d32' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='720' cy='150' r='4.5' fill='#c62828'/><rect x='705' y='226' width='30' height='48' rx='3' fill='#ffffff' stroke='#2e7d32' stroke-width='2.2'/><polyline points='720,226 720,274' fill='none' stroke='#2e7d32' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/><text x='742' y='251' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='bold' text-anchor='start' fill='#1a1a1a'>FB — bypass</text><text x='742' y='267' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>normally EMPTY</text><polyline points='720,274 720,360' fill='none' stroke='#2e7d32' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><text x='742' y='300' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>fuse in = light on regardless</text><text x='742' y='316' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>of the ESP32; fuse out =</text><text x='742' y='332' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>ESP32 has control</text><polyline points='520,360 900,360' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='520' cy='360' r='4.5' fill='#e07000'/><circle cx='720' cy='360' r='4.5' fill='#e07000'/><polyline points='900,360 900,426' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><rect x='885' y='426' width='30' height='48' rx='3' fill='#ffffff' stroke='#e07000' stroke-width='2.2'/><polyline points='900,426 900,474' fill='none' stroke='#e07000' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/><text x='878' y='451' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='bold' text-anchor='end' fill='#1a1a1a'>F1 — branch</text><text x='878' y='467' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='end' fill='#5f6368'>always fitted</text><polyline points='900,474 900,538' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='900' cy='570' r='32' fill='#ffffff' stroke='#e07000' stroke-width='2.4'/><polyline points='877.376,547.376 922.624,592.624' fill='none' stroke='#e07000' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/><polyline points='877.376,592.624 922.624,547.37