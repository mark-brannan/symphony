<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='920' viewBox='0 0 1080 920'><rect x='0' y='0' width='1080' height='920' rx='0' fill='#ffffff' stroke='#ffffff' stroke-width='0'/><text x='30' y='40' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='21' font-weight='bold' text-anchor='start' fill='#1a1a1a'>One channel — opto-driven high-side P-MOSFET, with manual bypass</text><text x='30' y='63' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='13.5' font-weight='normal' text-anchor='start' fill='#5f6368'>Repeat five times. Values are working stand-ins; only the MOSFET and the two fuses scale with the load.</text><polyline points='30,150 1030,150' fill='none' stroke='#c62828' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/><text x='30' y='132' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#5f6368'>+12 V from the main run</text><polyline points='30,830 1030,830' fill='none' stroke='#212121' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/><text x='30' y='852' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#5f6368'>to negative bus — one bonding point for the board and the fixtures</text><polyline points='30,870 1030,870' fill='none' stroke='#dddddd' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/><text x='30' y='892' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>R1 holds Q1's gate at the source rail, so OFF is the default at every point in the ESP32's boot — and the state it falls back to if the ESP32 dies.</text><text x='30' y='910' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>R4 covers the window before firmware drives the pin, when the GPIO is high-impedance. FB is then the only way to get the light back — deliberately manual.</text><polyline points='474,226 474,274' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='490,226 490,240' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='490,244 490,256' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='490,260 490,274' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='490,232 520,232 520,220' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='490,268 520,268 520,280' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='490,250 520,250 520,232' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polygon points='498,244 498,256 510,250' fill='#e07000'/><polyline points='520,220 520,150' fill='none' stroke='#c62828' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='520,280 520,360' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='520' cy='150' r='4.5' fill='#c62828'/><text x='556' y='236' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' text-anchor='start' fill='#1a1a1a'>Q1</text><text x='556' y='254' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='start' fill='#1a1a1a'>P-channel MOSFET</text><text x='556' y='270' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>≥ 60 V, low R_DS(on)</text><polyline points='474,250 400,250' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><rect x='389' y='176' width='22' height='48' rx='2' fill='#ffffff' stroke='#e07000' stroke-width='2.2'/><text x='417' y='205' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>R1  100 kΩ</text><polyline points='400,150 400,176' fill='none' stroke='#c62828' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='400,224 400,306' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='400' cy='150' r='4.5' fill='#c62828'/><circle cx='400' cy='250' r='4.5' fill='#e07000'/><polygon points='309,211 331,211 320,192' fill='#e07000'/><polyline points='307,192 333,192' fill='none' stroke='#e07000' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><polyline points='307,192 303,186' fill='none' stroke='#e07000' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><polyline points='333,192 337,198' fill='none' stroke='#e07000' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><text x='300' y='205' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='end' fill='#1a1a1a'>D1  15 V</text><polyline points='320,150 320,188' fill='none' stroke='#c62828' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='320,211 320,250 400,250' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='320' cy='150' r='4.5' fill='#c62828'/><text x='220' y='232' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='end' fill='#5f6368'>V_GS clamp</text><rect x='389' y='306' width='22' height='48' rx='2' fill='#ffffff' stroke='#e07000' stroke-width='2.2'/><text x='417' y='335' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#