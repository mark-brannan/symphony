<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='1240' height='620' viewBox='0 0 1240 620'><rect x='0' y='0' width='1240' height='620' rx='0' fill='#ffffff' stroke='#ffffff' stroke-width='0'/><text x='30' y='40' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='21' font-weight='bold' text-anchor='start' fill='#1a1a1a'>Feedback options — what the ESP32 knows about the channel</text><text x='30' y='63' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='13.5' font-weight='normal' text-anchor='start' fill='#5f6368'>One channel shown. Option A is v1; B and C are the upgrades the board should leave footprints for.</text><rect x='30' y='90' width='380' height='452' rx='8' fill='#ffffff' stroke='#dddddd' stroke-width='2'/><text x='50' y='122' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14.5' font-weight='bold' text-anchor='start' fill='#5f6368'>A — command only</text><text x='390' y='122' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='end' fill='#5f6368'>v1</text><polyline points='50,138 390,138' fill='none' stroke='#eeeeee' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='50' y='178' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>output node (Q1 ∥ bypass fuse)</text><polyline points='50,200 360,200' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polygon points='360,193 360,207 378,200' fill='#e07000'/><text x='330' y='186' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='end' fill='#5f6368'>to F1 → fixture</text><polyline points='50,420 378,420' fill='none' stroke='#212121' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><text x='50' y='440' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' text-anchor='start' fill='#5f6368'>negative</text><text x='50' y='465' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>No parts. The ESP32 knows what it commanded</text><text x='50' y='482' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>and nothing else. A blown lamp, a blown branch</text><text x='50' y='499' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>fuse, or a bypass fuse someone left in all look</text><text x='50' y='516' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>identical from the helm: exactly like normal.</text><rect x='425' y='90' width='380' height='452' rx='8' fill='#ffffff' stroke='#dddddd' stroke-width='2'/><text x='445' y='122' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14.5' font-weight='bold' text-anchor='start' fill='#1565c0'>B — load-present sense</text><text x='785' y='122' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='end' fill='#5f6368'>2 resistors/ch</text><polyline points='445,138 785,138' fill='none' stroke='#eeeeee' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='445' y='178' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>output node (Q1 ∥ bypass fuse)</text><polyline points='445,200 755,200' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polygon points='755,193 755,207 773,200' fill='#e07000'/><text x='725' y='186' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='end' fill='#5f6368'>to F1 → fixture</text><polyline points='445,420 773,420' fill='none' stroke='#212121' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><text x='445' y='440' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' text-anchor='start' fill='#5f6368'>negative</text><text x='445' y='465' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>Reads the voltage at the load side of F1. Tells</text><text x='445' y='482' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>apart: commanded-on and lit; commanded-off but</text><text x='445' y='499' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>energised (bypass fuse left in); commanded-on</text><text x='445' y='516' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>but dead (open lamp or blown branch fuse).</text><rect x='820' y='90' width='380' height='452' rx='8' fill='#ffffff' stroke='#dddddd' stroke-width='2'/><text x='840' y='122' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14.5' font-weight='bold' text-anchor='start' fill='#2e7d32'>C — current sense</text><text x='1180' y='122' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='end' fill='#5f6368'>1 IC + shunt/ch</text><polyline points='840,138 1180,138' fill='none' stroke='#eeeeee' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='840' y='178' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>output node (Q1 ∥ bypass fuse)</text><polyline points='840,200 1150,200' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polygon points='1150,193 1150,207 1168,200' fill='#e07000'/><text x='1120' y='186' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='end' fill='#5f6368'>to F1 → fixture</text><polyline points='840,420 1168,420' fill='none' stroke='#212121' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><text x='840' y='440' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' text-anchor='start' fill='#5f6368'>negative</text><text x='840' y='465' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>Actual amps per channel. Adds what B cannot see:</text><text x='840' y='482' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>a partly-failed LED array, a fixture drawing high</text><text x='840' y='499' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>before it fails, and a real power budget. Needs</text><text x='840' y='516' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>calibration and I²C address planning.</text><circle cx='575' cy='200' r='4.5' fill='#e07000'/><polyline points='575,200 575,236' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><rect x='564' y='236' width='22' height='48' rx='2' fill='#ffffff' stroke='#1565c0' stroke-width='2.2'/><text x='592' y='265' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>100 kΩ</text><polyline points='575,284 575,336' fill='none' stroke='#1565c0' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='575' cy='310' r='4.5' fill='#1565c0'/><rect x='564' y='336' width='22' height='48' rx='2' fill='#ffffff' stroke='#1565c0' stroke-width='2.2'/><text x='592' y='365' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>22 kΩ</text><polyline points='575,384 575,420' fill='none' stroke='#212121' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='575' cy='420' r='4.5' fill='#212121'/><polyline points='575,310 655,310' fill='none' stroke='#1565c0' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><rect x='655' y='282' width='120' height='56' rx='5' fill='#f3f7fd' stroke='#1565c0' stroke-width='2.2'/><text x='715' y='306' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='bold' text-anchor='middle' fill='#1565c0'>ESP32</text><text x='715' y='324' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>ADC in</text><text x='445' y='260' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>12 V →</text><text x='445' y='276' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>2.2 V</text><rect x='946' y='186' width='48' height='28' rx='3' fill='#ffffff' stroke='#2e7d32' stroke-width='2.2'/><text x='970' y='240' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' text-anchor='middle' fill='#2e7d32'>R_S</text><polyline points='940,200 940,250' fill='none' stroke='#2e7d32' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/><polyline points='1000,200 1000,250' fill='none' stroke='#2e7d32' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/><circle cx='940' cy='200' r='3.6' fill='#2e7d32'/><circle cx='1000' cy='200' r='3.6' fill='#2e7d32'/><rect x='900' y='250' width='160' height='66' rx='5' fill='#f1f8f1' stroke='#2e7d32' stroke-width='2.2'/><text x='980' y='276' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='bold' text-anchor='middle' fill='#2e7d32'>INA226</text><text x='980' y='296' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' text-anchor='middle' fill='#5f6368'>high-side monitor</text><polyline points='980,316 980,420' fill='none' stroke='#212121' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='980' cy='420' r='4.5' fill='#212121'/><polyline points='1060,283 1100,283' fill='none' stroke='#1565c0' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='6 4'/><rect x='1100' y='255' width='70' height='56' rx='5' fill='#f3f7fd' stroke='#1565c0' stroke-width='2.2'/><text x='1135' y='279' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' text-anchor='middle' fill='#1565c0'>ESP32</text><text x='1135' y='297' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>I²C</text></svg>