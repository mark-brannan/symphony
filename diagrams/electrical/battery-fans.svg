 Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='start' fill='#5f6368'>Run about 3 ft bus to Cerbo and 3 ft Cerbo to fans (guess): drop about 0.6 % round trip at 1.5 A.</text></svg>