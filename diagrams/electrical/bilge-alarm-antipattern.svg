<svg xmlns='http://www.w3.org/2000/svg' width='900' height='420' viewBox='0 0 900 420'><rect x='0' y='0' width='900' height='420' rx='0' fill='#ffffff' stroke='#ffffff' stroke-width='0'/><text x='30' y='38' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' text-anchor='start' fill='#c62828'>Do NOT do this</text><text x='30' y='60' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' text-anchor='start' fill='#5f6368'>Tapping the piezo's hot leg straight into the digital input.</text><rect x='40' y='100' width='150' height='70' rx='5' fill='#ffffff' stroke='#1a1a1a' stroke-width='2.4'/><text x='115' y='128' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='bold' text-anchor='middle' fill='#1a1a1a'>water switch</text><text x='115' y='146' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='middle' fill='#e07000'>OUT</text><polyline points='190,130 600,130' fill='none' stroke='#e07000' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><polyline points='320,130 320,220' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><rect x='250' y='220' width='140' height='60' rx='5' fill='#ffffff' stroke='#1a1a1a' stroke-width='2.4'/><text x='320' y='256' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='bold' text-anchor='middle' fill='#1a1a1a'>PIEZO</text><polyline points='320,280 320,330 40,330' fill='none' stroke='#212121' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><text x='30' y='352' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='start' fill='#5f6368'>negative</text><polyline points='600,130 660,130 660,200 700,200' fill='none' stroke='#e07000' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><rect x='700' y='160' width='160' height='130' rx='5' fill='#ffffff' stroke='#1565c0' stroke-width='2.4'/><text x='780' y='190' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' text-anchor='middle' fill='#1565c0'>CERBO GX</text><text x='780' y='210' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='middle' fill='#1565c0'>DI n</text><text x='780' y='236' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>3.3 V logic</text><text x='780' y='252' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>10 kΩ to 3V3</text><text x='780' y='274' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='bold' text-anchor='middle' fill='#c62828'>NOT isolated</text><polyline points='638,187 682,143' fill='none' stroke='#c62828' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='638,143 682,187' fill='none' stroke='#c62828' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/><text x='30' y='372' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>12 V onto a 3.3 V input that is referenced to the Cerbo's own ground. It reads as permanently triggered at best;</text><text x='30' y='392' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>at worst any fault on the bilge run travels straight into the GX. The isolation device is the whole point of this circuit.</text></svg>