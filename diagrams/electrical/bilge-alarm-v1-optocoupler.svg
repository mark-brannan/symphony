<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='940' viewBox='0 0 1280 940'><rect x='0' y='0' width='1280' height='940' rx='0' fill='#ffffff' stroke='#ffffff' stroke-width='0'/><text x='30' y='40' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='21' font-weight='bold' text-anchor='start' fill='#1a1a1a'>Variant 1 — recommended: SEAFLO field switch + piezo + PC817 optocoupler</text><text x='30' y='63' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='13.5' font-weight='normal' text-anchor='start' fill='#5f6368'>Solid state end to end. Victron specifies the digital input for a dry contact or an open-collector optocoupler; this is the second case.</text><g transform='translate(0,70)'><rect x='188' y='404' width='300' height='206' rx='6' fill='#e3f2fd' stroke='#bbdefb' stroke-width='1.5' stroke-dasharray='6 4'/><text x='198' y='601' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='bold' text-anchor='start' fill='#4a7fb5'>IN THE BILGE</text><polyline points='40,70 460,70' fill='none' stroke='#c62828' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><text x='30' y='18' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#5f6368'>from unswitched, always-on fused distribution</text><rect x='80' y='57' width='56' height='26' rx='3' fill='#ffffff' stroke='#c62828' stroke-width='2.2'/><polyline points='88,70 98,64 110,76 120,70 128,70' fill='none' stroke='#c62828' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><text x='108' y='104' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' text-anchor='middle' fill='#c62828'>FUSE 1 A</text><polyline points='40,650 930,650' fill='none' stroke='#212121' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><text x='30' y='674' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#5f6368'>to DC negative bus</text><polyline points='170,70 170,460 228,460' fill='none' stroke='#c62828' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='170' cy='70' r='4.5' fill='#c62828'/><rect x='228' y='424' width='232' height='122' rx='5' fill='#ffffff' stroke='#1a1a1a' stroke-width='2.4'/><text x='344' y='460' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' text-anchor='middle' fill='#1a1a1a'>SEAFLO electric-field switch</text><text x='344' y='482' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>solid state, no moving parts</text><text x='344' y='498' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>trips ~50 mm, 3 s delay</text><circle cx='228' cy='460' r='4' fill='#ffffff' stroke='#c62828' stroke-width='2'/><text x='222' y='448' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='end' fill='#c62828'>+12 V</text><circle cx='344' cy='424' r='4' fill='#ffffff' stroke='#e07000' stroke-width='2'/><text x='354' y='418' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#e07000'>OUT</text><circle cx='344' cy='546' r='4' fill='#ffffff' stroke='#212121' stroke-width='2'/><text x='354' y='562' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#212121'>NEG</text><polyline points='344,424 344,300' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='344,546 344,650' fill='none' stroke='#212121' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='344' cy='300' r='4.5' fill='#e07000'/><circle cx='344' cy='650' r='4.5' fill='#212121'/><polyline points='344,300 930,300' fill='none' stroke='#e07000' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><text x='356' y='288' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#e07000'>switched +12 V — hot only while the alarm is active</text><polyline points='202,320 196,320 196,430 202,430' fill='none' stroke='#5f6368' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='188' y='379' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='end' fill='#5f6368'></text><text x='160' y='336' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='end' fill='#5f6368'>Run B: 1–3 m</text><text x='160' y='352' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='end' fill='#5f6368'>3-cond 16 AWG</text><text x='160' y='368' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='end' fill='#5f6368'>tinned, jacketed</text><polyline points='145,52 145,46 460,46 460,52' fill='none' stroke='#5f6368' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='302.5' y='38' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='middle' fill='#5f6368'>Run A — 1–3 m, 16 AWG × 2 (+12 V and negative)</text><circle cx='460' cy='70' r='4.5' fill='#c62828'/><polyline points='460,70 460,300' fill='none' stroke='#c62828' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='460,124 460,136' fill='none' stroke='#c62828' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='460,176 460,164' fill='none' stroke='#c62828' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='444,136 472,166' fill='none' stroke='#c62828' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='466,136 482,136' fill='none' stroke='#c62828' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/><polyline points='474,136 474,126' fill='none' stroke='#c62828' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/><text x='486' y='155' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>TEST (optional)</text><polygon points='449,214 471,214 460,233' fill='#c62828'/><polyline points='447,233 473,233' fill='none' stroke='#c62828' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><text x='478' y='230' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>1N4001 — blocks back-feed</text><circle cx='460' cy='300' r='4.5' fill='#e07000'/><polyline points='570,300 570,380' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='570,450 570,650' fill='none' stroke='#212121' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='570' cy='300' r='4.5' fill='#e07000'/><circle cx='570' cy='650' r='4.5' fill='#212121'/><rect x='500' y='380' width='140' height='70' rx='5' fill='#ffffff' stroke='#1a1a1a' stroke-width='2.4'/><text x='570' y='408' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' text-anchor='middle' fill='#1a1a1a'>PIEZO ALARM</text><text x='570' y='426' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>SEAFLO 95 dB, 12 V</text><text x='570' y='441' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>&lt; 60 mA</text><circle cx='700' cy='300' r='4.5' fill='#e07000'/><polyline points='700,300 700,400 730,400' fill='none' stroke='#e07000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><rect x='689' y='321' width='22' height='48' rx='2' fill='#ffffff' stroke='#e07000' stroke-width='2.2'/><text x='718' y='350' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#1a1a1a'>R  1 kΩ  ¼ W</text><polyline points='730,480 660,480 660,650' fill='none' stroke='#212121' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='660' cy='650' r='4.5' fill='#212121'/><polygon points='704,451 726,451 715,432' fill='#212121'/><polyline points='702,432 728,432' fill='none' stroke='#212121' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><text x='688' y='445' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='end' fill='#1a1a1a'>D</text><rect x='730' y='360' width='200' height='160' rx='5' fill='#fafafa' stroke='#1a1a1a' stroke-width='2.4'/><polyline points='830,366 830,514' fill='none' stroke='#9e9e9e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='5 4'/><text x='830' y='384' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='13.5' font-weight='bold' text-anchor='middle' fill='#1a1a1a'>PC817</text><text x='760' y='447' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='end' fill='#5f6368'>LED</text><text x='830' y='502' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11' font-weight='normal' text-anchor='middle' fill='#5f6368'>5 kV isolation</text><polygon points='768,432 792,432 780,452' fill='#e07000'/><polyline points='766,452 794,452' fill='none' stroke='#e07000' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><polyline points='780,410 780,432' fill='none' stroke='#e07000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><polyline points='780,452 780,472' fill='none' stroke='#212121' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><polyline points='796,428 806,418' fill='none' stroke='#e07000' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/><polyline points='798,438 808,428' fill='none' stroke='#e07000' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/><circle cx='884' cy='448' r='24' fill='none' stroke='#1565c0' stroke-width='2'/><polyline points='876,434 876,462' fill='none' stroke='#1565c0' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><polyline points='876,440 896,428' fill='none' stroke='#1565c0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><polyline points='876,456 896,468' fill='none' stroke='#1565c0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><polyline points='896,428 896,410' fill='none' stroke='#1565c0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><polyline points='896,468 896,486' fill='none' stroke='#1565c0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><circle cx='730' cy='400' r='4' fill='#ffffff' stroke='#e07000' stroke-width='2'/><text x='736' y='394' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#e07000'>A</text><circle cx='730' cy='480' r='4' fill='#ffffff' stroke='#212121' stroke-width='2'/><text x='736' y='496' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#212121'>K</text><circle cx='930' cy='400' r='4' fill='#ffffff' stroke='#1565c0' stroke-width='2'/><text x='922' y='394' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='end' fill='#1565c0'>C</text><circle cx='930' cy='480' r='4' fill='#ffffff' stroke='#1565c0' stroke-width='2'/><text x='922' y='496' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='end' fill='#1565c0'>E</text><polyline points='896,410 896,400 930,400' fill='none' stroke='#1565c0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><polyline points='896,486 896,480 930,480' fill='none' stroke='#1565c0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><polyline points='780,472 780,480 730,480' fill='none' stroke='#212121' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><polyline points='780,410 780,400 730,400' fill='none' stroke='#e07000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><polyline points='930,400 980,400' fill='none' stroke='#1565c0' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><polyline points='930,480 980,480' fill='none' stroke='#1565c0' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><rect x='980' y='340' width='190' height='200' rx='5' fill='#ffffff' stroke='#1565c0' stroke-width='2.4'/><text x='1075' y='368' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='13.5' font-weight='bold' text-anchor='middle' fill='#1565c0'>CERBO GX MK2</text><text x='1075' y='386' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>digital input block</text><text x='1075' y='420' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>3V3 via 10 kΩ pull-up</text><text x='1075' y='436' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>pull LOW to trigger</text><text x='1075' y='452' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368'>0.33 mA · NOT isolated</text><circle cx='980' cy='400' r='4' fill='#ffffff' stroke='#1565c0' stroke-width='2'/><text x='992' y='395' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1565c0'>DI n</text><circle cx='980' cy='480' r='4' fill='#ffffff' stroke='#1565c0' stroke-width='2'/><text x='992' y='475' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#1565c0'>GND</text><text x='1075' y='562' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='middle' fill='#5f6368' font-style='italic'>collector to DI n, emitter to GND</text><polyline points='930,590 930,596 1170,596 1170,590' fill='none' stroke='#5f6368' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><text x='1050' y='613' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='middle' fill='#5f6368'>≤ 12 in, 20 AWG + ferrules</text><text x='30' y='690' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='start' fill='#1a1a1a'>I_F = (12 − 1.2 V) / 1 kΩ = 10.8 mA. The input needs only 0.33 mA, so CTR of 3.3 % suffices — a PC817 rank A gives 80 % minimum, and V_CE(sat) stays under 0.2 V.</text><text x='30' y='708' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' text-anchor='start' fill='#1a1a1a'>D is a 1N4148 anti-parallel across the LED: the PC817's reverse LED rating is only 6 V, and the sensor's output polarity is not verified until you meter it.</text><text x='30' y='726' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='bold' text-anchor='start' fill='#c62828'>Leave the module's output-side VCC DISCONNECTED — an on-board pull-up would drive 5 V into a 3.3 V input.</text><polyline points='960,40 986,40' fill='none' stroke='#c62828' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/><text x='993' y='44.5' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>+12 V, always-on fused feed</text><polyline points='960,59 986,59' fill='none' stroke='#212121' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/><text x='993' y='63.5' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>negative</text><polyline points='960,78 986,78' fill='none' stroke='#e07000' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/><text x='993' y='82.5' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>switched 12 V (hot only during alarm)</text><polyline points='960,97 986,97' fill='none' stroke='#1565c0' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/><text x='993' y='101.5' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' text-anchor='start' fill='#5f6368'>isolated signal side</text></g><polyline points='30,840 1250,840' fill='none' stroke='#dddddd' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/><text x='30' y='862' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#5f6368'>Fuse 1 A ATC/ATO  ·  all power conductors 16 AWG tinned, 105 °C  ·  ampacity 25 A outside engine space, 21 A inside (×0.85)</text><text x='30' y='880' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#5f6368'>Design load ≤ 0.25 A  ·  worst case 6 m one-way = 39 ft round trip → 0.04 V drop (0.3 %)  ·  16 AWG holds 3 % to ~345 ft round trip</text><text x='30' y='898' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' text-anchor='start' fill='#5f6368'>Gauge is set by the ABYC 16 AWG minimum, not by ampacity or voltage drop: no gauge change anywhere in the 1–3 m range.</text></svg>