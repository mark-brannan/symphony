# as-built v1 steps 18, 20, 21, 25: packages, the two HALOS apps that must stay
# down, and swap. Everything a later role needs installed is installed here.

- name: step 18 | InfluxData package signing key
  ansible.builtin.copy:
    src: influxdata-archive.gpg
    dest: /etc/apt/keyrings/influxdata-archive.gpg
    owner: root
    group: root
    mode: "0644"
  # Carried in the repo rather than fetched at run time so a card can be built
  # on the boat's cellular link, which is where every rebuild has failed before
  # (see priorities.md). Fingerprint, checked against InfluxData's published
  # value: 24C9 75CB A61A 024E E1B6 3178 7C3D 5715 9FC2 F927.

- name: step 18 | python3-debian (deb822_repository needs it on the target)
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: step 18 | retire the old influxdata.list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/influxdata.list
    state: absent
  register: influx_old_list
  # Cards built before 2026-10 carry this one-line .list; the .sources below
  # replaces it, and apt warns on every update if both name the same repo.
  # Runs before the .sources is written so apt never sees both.

- name: step 18 | InfluxData apt repository
  ansible.builtin.deb822_repository:
    name: influxdata
    types: deb
    uris: https://repos.influxdata.com/debian
    suites: stable
    components: main
    signed_by: /etc/apt/keyrings/influxdata-archive.gpg
    state: present
  register: influx_repo
  # Under --check the python3-debian install above does not really happen, so
  # a card without it yet cannot run this module; that is not a finding.
  failed_when: >-
    influx_repo.failed
    and not (ansible_check_mode and 'python3-debian' in (influx_repo.msg | default('')))

- name: step 18 | refresh apt after an InfluxData repo change
  ansible.builtin.apt:
    update_cache: true
  when: influx_repo.changed or influx_old_list.changed
  # deb822_repository has no update_cache of its own.

- name: step 18 | telegraf and chrony
  ansible.builtin.apt:
    name:
      - telegraf
      - chrony
    state: present
  # Under --check the InfluxData repo above is not really added, so a card
  # without telegraf yet cannot resolve it; that is not a finding.
  register: base_packages
  failed_when: >-
    base_packages.failed
    and not (ansible_check_mode and 'telegraf' in (base_packages.msg | default('')))
  # chrony's install removes systemd-timesyncd. That is wanted: timesyncd
  # cannot step a clock that is hours out, which is exactly the state a card
  # with no RTC boots into after a week on the hard.

- name: step 25 | zram swap
  ansible.builtin.apt:
    name: systemd-zram-generator
    state: present

- name: step 25 | 1 GB of zstd-compressed swap at priority 100
  ansible.builtin.copy:
    src: zram-generator.conf
    dest: /etc/systemd/zram-generator.conf
    owner: root
    group: root
    mode: "0644"
  notify: regenerate zram devices
  # `min(ram/2, 1024)` gives the 2 GB bench card 1 GB and the 4 GB boat card
  # the same 1 GB, so the two behave alike under memory pressure. Priority 100
  # puts it ahead of any disk swap, which on an SD card is the point.

- name: step 20 | the HALOS InfluxDB app is purged, not merely removed
  ansible.builtin.apt:
    name: marine-influxdb-container
    state: absent
    purge: true
  # `remove` leaves the unit file behind. It still starts at boot, still fails,
  # and the heartbeat still reports it. Only purge takes the unit.

- name: step 21 | AvNav and OpenCPN stay down
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - marine-avnav-container
    - marine-opencpn-container
  failed_when: false
  # Not used on this boat, and on a 2 GB card they are the difference between
  # SignalK cold-starting in 4 minutes and being killed for memory. `false`
  # because a card that never had them installed is not a failure.

- name: step 26 | host services are running
  ansible.builtin.command: systemctl is-active telegraf chrony
  register: base_services
  changed_when: false
  # Read-only, so it must still run under --check; otherwise the assertions
  # below have nothing to read and --check cannot be used to audit a card.
  check_mode: false
  failed_when: false
  tags: [verify]

- name: step 26 | report host services
  ansible.builtin.debug:
    msg: "telegraf/chrony: {{ base_services.stdout_lines | join(' ') }}"
  tags: [verify]

# is-active only proves these are up right now. docker and ssh are never
# installed by this playbook (RUNBOOK "Bringing up a host" Phase 1, and Pi
# OS respectively), so this is the only place their boot-enabled state gets
# checked at all -- added after a reboot left tailscaled disabled with every
# other check green (2026-09-04); the same gap could exist here unnoticed.
- name: step 26 | host services are enabled (survive a reboot, not just running now)
  ansible.builtin.command: systemctl is-enabled telegraf chrony docker ssh
  register: base_enabled
  changed_when: false
  check_mode: false
  failed_when: false
  tags: [verify]

- name: step 26 | assert telegraf/chrony/docker/ssh are enabled
  ansible.builtin.assert:
    that: "base_enabled.stdout_lines | difference(['enabled']) | length == 0"
    fail_msg: "telegraf/chrony/docker/ssh: {{ base_enabled.stdout_lines | join(' ') }}"
    success_msg: "telegraf/chrony/docker/ssh: {{ base_enabled.stdout_lines | join(' ') }}"
  tags: [verify]

- name: step 26 | chrony has a source and is tracking
  ansible.builtin.command: chronyc tracking
  register: chrony_tracking
  changed_when: false
  # Read-only, so it must still run under --check; otherwise the assertions
  # below have nothing to read and --check cannot be used to audit a card.
  check_mode: false
  tags: [verify]

- name: step 26 | report the clock
  ansible.builtin.debug:
    msg: "{{ chrony_tracking.stdout_lines[:3] }}"
  tags: [verify]
