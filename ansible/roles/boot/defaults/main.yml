# Firmware lines the board needs that its image does not already set. The
# defaults are the Pi 4 with the PiCAN-M HAT; a board whose image already wires
# its own CAN, UART and SPI (the HALPI2) overrides both in host_vars.
boot_firmware_params:
  - dtparam=i2c_arm=on
  - dtparam=spi=on
  - enable_uart=1
boot_dtoverlays:
  - dtoverlay=mcp2515-can0,oscillator=16000000,interrupt=25
  - dtoverlay=spi-bcm2835-overlay
