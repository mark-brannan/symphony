# as-built v1 steps 9-11, 16: the wifi profiles the card needs to find the boat,
# the access point it offers when there is no boat wifi, and the tailnet name.

# The keyfiles were exported from the boat card and carry `mac-address=`
# pinning them to that Pi's radio; on any other board the profile exists but
# never activates, with nothing logged. Strip the pin so the same secret
# serves the bench Pi, a Pi 5 or a HALPI2 (found on a fresh card, 2026-09-03).
- name: step 9 | boat wifi profiles
  ansible.builtin.copy:
    content: "{{ symphony_secrets[item.key] | regex_replace('(?m)^mac-address=.*\\n', '') }}"
    dest: "/etc/NetworkManager/system-connections/{{ item.name }}.nmconnection"
    owner: root
    group: root
    mode: "0600"
  loop:
    - {name: Symphony, key: nm_symphony_nmconnection}
    - {name: Symphony_5G, key: nm_symphony_5g_nmconnection}
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: reload NetworkManager profiles
  # 0600 is not cosmetic: NetworkManager refuses to load a keyfile that is
  # group- or world-readable, and says so only in the journal.

# HALOS ships its own AP profile and owns the file; Symphony changes two fields
# in it rather than replacing it, so a HALOS update that adds a setting to the
# profile is not silently reverted on the next converge.
- name: step 10 | the card's own access point advertises SignalK
  community.general.ini_file:
    path: /etc/NetworkManager/system-connections/Halos-AP.nmconnection
    section: wifi
    option: ssid
    value: SignalK
    owner: root
    group: root
    mode: "0600"
    no_extra_spaces: true
  notify: reload NetworkManager profiles

- name: step 10 | the access point uses the boat's hotspot key
  community.general.ini_file:
    path: /etc/NetworkManager/system-connections/Halos-AP.nmconnection
    section: wifi-security
    option: psk
    # The sops key holds the boat card's whole SignalK-Hotspot keyfile; the
    # only field that transfers is the pre-shared key, because everything else
    # in it describes the boat card's radio, not this one's.
    value: "{{ symphony_secrets.nm_signalk_hotspot_nmconnection | regex_search('(?m)^psk=(.*)$', '\\1') | first }}"
    owner: root
    group: root
    mode: "0600"
    no_extra_spaces: true
  no_log: true
  notify: reload NetworkManager profiles
  # Same SSID and key as the boat card's hotspot, so anything already paired
  # with SignalK keeps working across the swap without being re-paired.

# The login itself (`tailscale up`) needs Mark's browser -- that part stays
# bootstrap, by hand, per RUNBOOK → Remote SSH access. The package does not:
# a card was found on 2026-09-04 with no tailscale binary at all (a reflash
# most likely) and the login-only assumption meant nobody had a step that put
# it back. Installing is idempotent (`creates` below), so this runs on every
# converge and only ever does anything the first time.
- name: step 16 | is tailscale installed
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: ts_bin_pre

- name: step 16 | install tailscale
  ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
  args:
    creates: /usr/bin/tailscale
  when: not ts_bin_pre.stat.exists
  # The official installer detects distro/codename/arch itself; the boat and
  # bench cards aren't guaranteed to match, and replicating that detection
  # with get_url + apt_repository would be one more thing to keep in sync
  # with two card OSes instead of one upstream script.

# Unconditional and re-registered under its own name rather than reusing
# ts_bin_pre: a task registering the same var name a second time, but skipped
# by `when`, overwrites it with a skip result that has no `.stat` at all --
# every task below would then fail evaluating its own `when`. Found running
# this against the freshly-reinstalled bench card, 2026-09-04.
- name: step 16 | current tailscale install state
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: ts_bin

- name: step 16 | tailnet state before provisioning
  ansible.builtin.command: tailscale status --json
  register: ts_status_pre
  changed_when: false
  failed_when: false
  check_mode: false
  when: ts_bin.stat.exists

- name: step 16 | tailnet identity | what the daemon reports now
  ansible.builtin.set_fact:
    tailnet_status: "{{ ts_status_pre.stdout | default('') | trim | default('{}', true) | from_json }}"
  when: ts_bin.stat.exists
  # `| trim | default('{}', true)` because ts_status_pre is failed_when: false
  # and a daemon that is down exits non-zero with nothing on stdout; from_json
  # of an empty string is a hard error, and vars/main.yml then has no
  # tailnet_status to read.

# Steps 1-5 of reference/tailnet_identity.md: a reflashed card gets its tailnet
# name and tag back without a click in the admin console. Reached only when the
# card is not already itself -- see tailnet_identity_ok in vars/main.yml, which
# is what keeps a converge against a working card inert.
#
# Skipped under --check on purpose. The API calls below are not check-mode
# aware, so the alternative is a block whose first task no-ops and whose rest
# fails on an undefined var, which would cost site.yml its documented
# `--check --diff` audit run.
- name: step 16 | tailnet identity | provisioning would run
  ansible.builtin.debug:
    msg: >-
      This card is not registered as {{ tailscale_hostname }} with
      tag:symphony-devices; a real run would release the name and re-register
      it. --check makes no Tailscale API calls, so nothing was verified here.
  when: ts_bin.stat.exists and not tailnet_identity_ok and ansible_check_mode

- name: step 16 | tailnet identity
  when:
    - ts_bin.stat.exists
    - not tailnet_identity_ok
    - not ansible_check_mode
  block:
    # Every API call is delegated to the control machine: it is where the sops
    # key already is, so the client secret never crosses the wire to a card
    # that may be a bare reflash reached over the LAN. no_log on all of them --
    # the request carries either the client secret or the bearer token in a
    # header, and a failed task prints its own module arguments.
    - name: step 16 | tailnet identity | an access token for the provisioning client
      ansible.builtin.uri:
        url: https://api.tailscale.com/api/v2/oauth/token
        method: POST
        body_format: form-urlencoded
        body:
          client_id: "{{ symphony_secrets.tailscale_provision_client_id }}"
          client_secret: "{{ symphony_secrets.tailscale_provision_client_secret }}"
      register: ts_oauth
      delegate_to: localhost
      become: false
      no_log: true
      failed_when: false
      # The client secret does not expire, so nothing here rotates on a
      # schedule; the keys it mints below do the expiring. reference/
      # tailnet_identity.md § Rotation.

    - name: step 16 | tailnet identity | the provisioning client still works
      ansible.builtin.assert:
        that: ts_oauth.status == 200
        fail_msg: >-
          Tailscale returned {{ ts_oauth.status }} for the client-credentials
          exchange (401: the secret was rotated or the client deleted; 403: it
          lost the devices:core or auth_keys scope). RUNBOOK → Adding a secret
          replaces tailscale_provision_client_{id,secret}.
      # failed_when: false above plus this assert, because the token task runs
      # no_log -- letting the uri module fail it directly would stop the play
      # with the output hidden and no status code to act on.

    - name: step 16 | tailnet identity | every node in the tailnet
      ansible.builtin.uri:
        url: https://api.tailscale.com/api/v2/tailnet/-/devices
        headers:
          Authorization: "Bearer {{ ts_oauth.json.access_token }}"
      register: ts_device_list
      delegate_to: localhost
      become: false
      no_log: true

    - name: step 16 | tailnet identity | hand the device list to the guard
      ansible.builtin.set_fact:
        tailnet_devices: "{{ ts_device_list.json.devices }}"
      no_log: true
      # no_log because the list names Mark's personal phones and laptops, not
      # because it is a credential. The one derived value the guard produces is
      # printed in full by the next task.

    - name: step 16 | tailnet identity | nodes holding this card's name, offline
      ansible.builtin.debug:
        msg: >-
          {{ tailnet_stale_nodes | map(attribute='name') | list }}
      # The audit line for the delete below, which has to run no_log. If this
      # ever prints a name that is not this card's, stop: the guard in
      # vars/main.yml is wrong and the next task is about to remove somebody
      # else's machine.

    - name: step 16 | tailnet identity | release the name from the stale node
      ansible.builtin.uri:
        url: "https://api.tailscale.com/api/v2/device/{{ item.id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ ts_oauth.json.access_token }}"
      loop: "{{ tailnet_stale_nodes }}"
      register: ts_delete
      delegate_to: localhost
      become: false
      no_log: true
      failed_when: false
      # Deleting the node is the only thing that frees the name: a node that is
      # offline, or whose key has expired, still holds it, and `tailscale set
      # --hostname` against a held name silently registers `<name>-1` instead.
      # Observed live 2026-09-04.

    - name: step 16 | tailnet identity | the stale node is gone
      ansible.builtin.assert:
        that: ts_delete.results | rejectattr('status', 'in', [200]) | list | length == 0
        fail_msg: >-
          Tailscale API returned {{ ts_delete.results | map(attribute='status') | list }}
          deleting {{ tailnet_stale_nodes | map(attribute='name') | list }} (want all 200).
          Check the provisioning client still has the devices:core scope.
        success_msg: "released: {{ tailnet_stale_nodes | map(attribute='name') | list }}"
      when: ts_delete.results is defined
      # The delete runs no_log, so a non-2xx would otherwise fail the play with
      # "the output has been hidden". This puts the status codes back without
      # putting the bearer token back.

    # Registering is only for a card with no identity at all -- the reflash
    # case. A card that is already logged in under the wrong name needs no key:
    # the delete above freed the name, and `tailscale set --hostname` further
    # down renames it in place, which keeps the node key and does not drop the
    # ssh session this play may be running over. A wrong TAG on a logged-in
    # card is the one case left for a human; the debug below says so.
    - name: step 16 | tailnet identity | register this card
      when: (tailnet_status.BackendState | default('')) != 'Running'
      block:
        - name: step 16 | tailnet identity | mint a single-use tagged key
          ansible.builtin.uri:
            url: https://api.tailscale.com/api/v2/tailnet/-/keys
            method: POST
            body_format: json
            body:
              description: "ansible network role, {{ tailscale_hostname }}"
              expirySeconds: 600
              capabilities:
                devices:
                  create:
                    reusable: false
                    ephemeral: false
                    preauthorized: true
                    tags: ["tag:symphony-devices"]
            headers:
              Authorization: "Bearer {{ ts_oauth.json.access_token }}"
          register: ts_authkey
          delegate_to: localhost
          become: false
          no_log: true
          # Not ephemeral, deliberately: this card is staged to become the live
          # boat card, and an ephemeral node deletes itself after 30-60 minutes
          # offline, which on a cellular boat link is an ordinary Tuesday.
          # reference/tailnet_identity.md § Why not an ephemeral key.

        - name: step 16 | tailnet identity | bring the card up under its own name and tag
          ansible.builtin.command:
            argv:
              - tailscale
              - up
              - --ssh
              - "--authkey={{ ts_authkey.json.key }}"
              - "--hostname={{ tailscale_hostname }}"
          no_log: true
          # The key never reaches the card's disk: ansible.cfg sets
          # pipelining = True, so the module is fed to python over stdin. If
          # pipelining is ever turned off, this task starts writing the key
          # into a temp file under ~pi/.ansible/tmp instead.

# Re-read after provisioning so every task below judges the card as it is NOW,
# not as it was before the block above logged it in. Same `when` as the read at
# the top of the block, which is what keeps ts_status from being clobbered by a
# skip result on a card with no tailscale at all.
- name: step 16 | current tailnet node name
  ansible.builtin.command: tailscale status --json
  register: ts_status
  changed_when: false
  failed_when: false
  check_mode: false
  when: ts_bin.stat.exists

- name: step 16 | tailnet identity | the tag needs a human
  ansible.builtin.debug:
    msg: >-
      This card is logged in as
      {{ (ts_status.stdout | from_json).Self.DNSName | default('?') }} but does
      not carry tag:symphony-devices, so the tailnet policy does not apply to
      it. Re-tagging needs a re-authentication, which would drop this play's
      own ssh session: run `sudo tailscale up --ssh --force-reauth
      --hostname={{ tailscale_hostname }}` from a console on the card.
  when: >-
    ts_bin.stat.exists and ts_status.rc == 0
    and (ts_status.stdout | from_json).BackendState == "Running"
    and 'tag:symphony-devices' not in ((ts_status.stdout | from_json).Self.Tags | default([]))

# `Self` is a populated-looking placeholder (HostName present, PublicKey all
# zeroes) even while logged out -- `Self is defined` is true either way, so
# `BackendState` is the only field that actually distinguishes "authenticated"
# from "installed but never logged in" (found running this against a freshly
# reinstalled card, 2026-09-04: the rename below silently no-oped against a
# logged-out daemon instead of being skipped).
- name: step 16 | rename the tailnet node
  ansible.builtin.command: "tailscale set --hostname={{ tailscale_hostname }}"
  when: >-
    ts_bin.stat.exists and ts_status.rc == 0
    and (ts_status.stdout | from_json).BackendState == "Running"
    and (ts_status.stdout | from_json).Self.HostName != tailscale_hostname
  # Renaming keeps the node key and the tailnet IP; it is a display name, so
  # this does not re-authenticate the card or disturb an open ssh session.

- name: step 16 | tailscale needs Mark's login
  ansible.builtin.debug:
    msg: >-
      tailscale is installed but not logged in (BackendState {{
      (ts_status.stdout | from_json).BackendState }}). Run `sudo tailscale up
      --ssh --hostname={{ tailscale_hostname }}` by hand (RUNBOOK → Remote SSH
      access) -- the browser auth step isn't scriptable; the rename above
      was skipped until then.
  when: >-
    ts_bin.stat.exists and ts_status.rc == 0
    and (ts_status.stdout | from_json).BackendState != "Running"

# The rename above only proves tailscaled is up right now -- it says nothing
# about whether it survives a reboot. A bench power-cycle on 2026-09-04 left
# the card unreachable with every other check green, because nothing here
# asserted tailscaled's boot-enabled state.
- name: step 16 | tailscaled is enabled and active
  ansible.builtin.command: "systemctl {{ item }} --quiet tailscaled"
  register: ts_boot
  loop: [is-enabled, is-active]
  changed_when: false
  failed_when: false
  check_mode: false
  when: ts_bin.stat.exists
  tags: [verify]

- name: step 16 | assert tailscaled survives a reboot
  ansible.builtin.assert:
    that: ts_boot.results | selectattr('rc', 'ne', 0) | list | length == 0
    fail_msg: "tailscaled enabled/active rc: {{ ts_boot.results | map(attribute='rc') | list }} (want [0, 0]) -- a reboot silently drops the card off the tailnet"
  when: ts_bin.stat.exists
  tags: [verify]

# The verify below reads what NetworkManager has loaded. NetworkManager only
# reads new keyfiles on an explicit reload, and a handler fires only on the
# run that wrote them -- a keyfile landed by an earlier run that stopped
# before its handlers stays unread forever. So reload unconditionally here;
# it is cheap and does not drop the association the play runs over
# (measured on a fresh card, 2026-09-03: two runs failed the assertion with
# the files on disk).
- name: step 9 | NetworkManager has read the keyfiles
  ansible.builtin.command: nmcli connection reload
  changed_when: false
  check_mode: false

- name: step 9 | wifi profiles are loaded
  ansible.builtin.command: nmcli -t -f NAME connection show
  register: nm_conns
  changed_when: false
  # Read-only, so it must still run under --check; otherwise the assertions
  # below have nothing to read and --check cannot be used to audit a card.
  check_mode: false
  tags: [verify]

- name: step 9 | the three expected profiles exist
  ansible.builtin.assert:
    that:
      - "'Symphony' in nm_conns.stdout_lines"
      - "'Symphony_5G' in nm_conns.stdout_lines"
      - "'Halos-AP' in nm_conns.stdout_lines"
    success_msg: Symphony, Symphony_5G and Halos-AP are all known to NetworkManager
  tags: [verify]
