# Run playbooks from this directory: `cd ansible && ansible-playbook site.yml`.
# Every path below is relative to it.
[defaults]
inventory = inventory.yml
roles_path = roles
# The boat cards run the OS python; don't let Ansible warn about discovery on
# every task.
interpreter_python = auto_silent
# A retry file per failed run is noise in a repo whose worktree is the boat.
retry_files_enabled = False
# Task output is the deliverable here -- these playbooks are as much a record
# of the build as they are the build.
stdout_callback = yaml
display_skipped_hosts = False
# community.sops decrypts secrets/symphony.sops.yaml through the `sops` binary,
# which needs the age key at ~/.config/sops/age/keys.txt on the CONTROL machine.
vars_plugins_enabled = host_group_vars

[ssh_connection]
# The boat's uplink is cellular and slow; reuse the connection.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
