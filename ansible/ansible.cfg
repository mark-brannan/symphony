# Run playbooks from this directory: `cd ansible && ansible-playbook site.yml`.
# Every path below is relative to it.
[defaults]
# Deprecation warnings stay ON. There is one standing warning -- apt_repository
# in roles/base, which goes away in ansible-core 2.25 and whose replacement
# would move the InfluxData entry from influxdata.list to influxdata.sources on
# both cards, so migrating is a deliberate step rather than a swap. Suppressing
# it repo-wide would also hide the next deprecation some future role picks up,
# and the warning is what keeps that migration on the board.
inventory = inventory.yml
roles_path = roles
# The boat cards run the OS python; don't let Ansible warn about discovery on
# every task.
interpreter_python = auto_silent
# A retry file per failed run is noise in a repo whose worktree is the boat.
retry_files_enabled = False
# Task output is the deliverable here -- these playbooks are as much a record
# of the build as they are the build. (The `yaml` callback plugin this used to
# name was removed in community.general 12; result_format is its replacement.)
result_format = yaml
display_skipped_hosts = False
# community.sops decrypts secrets/symphony.sops.yaml through the `sops` binary,
# which needs the age key at ~/.config/sops/age/keys.txt on the CONTROL machine.
vars_plugins_enabled = host_group_vars

[ssh_connection]
# The boat's uplink is cellular and slow; reuse the connection.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
