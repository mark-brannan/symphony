# Single source of truth for which files carry secrets and who can decrypt
# them. Everything else derives from this file at runtime -- the pre-commit
# guard, the CI verifier, and the rotation tooling all read it via
# scripts/sops_paths.py. Do not keep a second copy of this list anywhere.
#
# Adding a secret:  scripts/add_inplace_secret.sh <file> <field>
# Rotating the key: scripts/rotate_age_key.sh   (see RUNBOOK.md)

# Every rule below shares this one recipient list via a YAML anchor, so
# adding or retiring a key is a ONE-LINE edit here rather than an edit to
# all eleven rules. That matters: a rotation that requires eleven identical
# edits is a rotation nobody performs, and a half-applied one silently
# leaves some files readable only by the retired key.
recipients: &recipients
  # Working key. Private half lives at ~/.config/sops/age/keys.txt and is
  # NEVER in git. This is the one that gets rotated.
  - age16xptea77u3806d20c2yjktfcfj06p2cwqrw84zktrhzys768e9ss0027gk

  # Escrow key, added 2026-08-07. Exists only so that losing the working key
  # is recoverable. Keep its private half somewhere separate from the working
  # key -- a different password manager, a printed copy, another machine --
  # and do NOT retire it during a routine rotation. Both keys are verified to
  # decrypt everything independently (scripts/rotate_age_key.sh verify).
  - age1a8je25wsr5x7vqznc7zfxjw9jswrwpallp5aphrtxsrcu7ws7shsvdez3q

creation_rules:
  # MUST stay above the general secrets/ rule below -- sops uses the FIRST
  # rule that matches, so putting it second would silently apply the anchor
  # and drop the manifest key.
  #
  # The pseudonym map turns pid.* tokens in signalk/security.json back into
  # email addresses. It gets its own recipient list so the manifest key can
  # answer "who is pid.rj232vx?" without also opening the boat's live
  # credentials -- which is the whole point of holding that key separately.
  #
  # The two keys below the manifest key mirror `recipients:` above.
  # scripts/rotate_age_key.sh keeps them in sync; don't hand-edit them.
  - path_regex: secrets/pseudonyms\.sops\.ya?ml$
    key_groups:
      - age:
          # Manifest key, generated 2026-08-12. Reads this file and nothing
          # else. Safe to hand to someone who needs to resolve a token.
          - age1n566m5z8e5nmhqkhxqmpd9jr2678t6l6wrzvcxrnckdjn9r2adjs55jgp9
          - age16xptea77u3806d20c2yjktfcfj06p2cwqrw84zktrhzys768e9ss0027gk
          - age1a8je25wsr5x7vqznc7zfxjw9jswrwpallp5aphrtxsrcu7ws7shsvdez3q

  # Layer 1 store: DB init creds, tokens shared across services. Whole-file
  # encryption -- keys and values both encrypted, only meant to be read via
  # `sops`, never opened directly.
  - path_regex: secrets/.*\.sops\.ya?ml$
    key_groups:
      - age: *recipients

  # Layer "in-place": files SignalK/Grafana read directly off disk and, in
  # SignalK's case, rewrite at runtime. Only the named leaf keys are
  # encrypted; everything else stays cleartext so the file is still legible
  # (and mergeable/diffable) in git.
  # clientSecret doesn't exist in the file today (OIDC is configured via
  # env vars) but appears if anyone saves the admin UI's OIDC form -- the
  # cleartext-sweep hook doesn't know that field name, so encrypt it here.
  - path_regex: signalk/security\.json$
    encrypted_regex: '^(secretKey|password|clientSecret)$'
    key_groups:
      - age: *recipients

  - path_regex: signalk/plugin-config-data/signalk-to-influxdb2\.json$
    encrypted_regex: '^token$'
    key_groups:
      - age: *recipients

  - path_regex: signalk/plugin-config-data/signalk-dsc\.json$
    encrypted_regex: '^logbookToken$'
    key_groups:
      - age: *recipients

  - path_regex: signalk/plugin-config-data/signalk-windy-plugin\.json$
    encrypted_regex: '^key$'
    key_groups:
      - age: *recipients

  - path_regex: signalk/plugin-config-data/signalk-usage\.json$
    encrypted_regex: '^token$'
    key_groups:
      - age: *recipients

  - path_regex: signalk/plugin-config-data/openweather-signalk\.json$
    encrypted_regex: '^apikey$'
    key_groups:
      - age: *recipients

  - path_regex: signalk/plugin-config-data/signalk-grafana\.json$
    encrypted_regex: '^adminPassword$'
    key_groups:
      - age: *recipients

  - path_regex: signalk/plugin-config-data/signalk-pushover-notification-relay\.json$
    encrypted_regex: '^(api_key|api_user)$'
    key_groups:
      - age: *recipients

  - path_regex: signalk/plugin-config-data/signalk-postgsail\.json$
    encrypted_regex: '^token$'
    key_groups:
      - age: *recipients

  - path_regex: signalk/plugin-config-data/venus\.json$
    encrypted_regex: '^password$'
    key_groups:
      - age: *recipients

  - path_regex: signalk/plugin-config-data/freeboard-sk\.json$
    encrypted_regex: '^apiKey$'
    key_groups:
      - age: *recipients

  - path_regex: signalk/plugin-config-data/signalk-saillogger\.json$
    encrypted_regex: '^uuid$'
    key_groups:
      - age: *recipients

  - path_regex: host/boat-heartbeat\.json$
    encrypted_regex: '^url$'
    key_groups:
      - age: *recipients
