services:
  dex:
    # Pinned: `latest` moving under the boat is not a surprise worth having
    # offshore, and Dex is the single point everything else authenticates
    # against. The digest is the multi-arch index (linux/amd64 for the dev
    # box, linux/arm64 for the Pi), not a single-platform manifest.
    image: ghcr.io/dexidp/dex:v2.45.1@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
    container_name: dex
    profiles: ["tls"]
    restart: unless-stopped
    # dex/config.yaml is rendered mode 600, owned by whoever ran render.py
    # (uid 1000 on these hosts); the image's default non-root user can't
    # read it. Dex needs no privileges -- run it as the file's owner.
    user: "1000:1000"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.docker.yaml:ro
    # Transitional, for as long as Caddy is still a native systemd service on
    # the boat Pi. Once Caddy is a container on symphony-net it reaches dex by
    # service name and this can go: container-to-container traffic never
    # touches the host. Bound to loopback deliberately -- Caddy is local, and
    # dex terminates no TLS of its own, so publishing this on 0.0.0.0 would put
    # the identity provider on the network in the clear.
    ports:
      - "127.0.0.1:5556:5556"
    # Dex's log is the only record of who signed in and when, and the default
    # json-file driver never rotates -- on a box whose SD card is the part
    # most likely to fail, an unbounded log is a slow leak. Capped rather
    # than shipped anywhere: two files is enough to answer "was that login
    # today", which is all this log is for.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks:
      - symphony-net
