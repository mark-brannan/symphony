# Host metrics for the boat computer -> InfluxDB.
#
# This is the master copy; /etc/telegraf/telegraf.conf is a symlink to it, so
# editing here is editing what runs. Debian's package ships a stub with no
# inputs at that path, which is why telegraf exited 1 on every boot until
# 2026-08-11.
#
# Everything SignalK publishes is vessel data. Nothing was recording what the
# *machine* was doing, so a hang or an out-of-memory event left no trail to
# read afterwards -- the whole reason this file exists.
#
# Credentials come from the rendered .env via an EnvironmentFile drop-in on
# telegraf.service; no secrets belong in here.

[agent]
  interval = "60s"
  round_interval = true
  # An SD card is the weak point on this box. Batch writes rather than
  # dribbling them out every interval.
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "60s"
  collection_jitter = "5s"
  flush_jitter = "5s"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "${TELEGRAF_INFLUX_TOKEN}"
  organization = "${TELEGRAF_INFLUX_ORG}"
  bucket = "${TELEGRAF_INFLUX_BUCKET}"
  # Keep host metrics distinguishable from vessel data in the shared bucket.
  [outputs.influxdb_v2.tagpass]
  [outputs.influxdb_v2.tagdrop]

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]

# Swap exhaustion is what actually bit on 2026-08-11; RAM alone wouldn't have
# shown it.
[[inputs.swap]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.system]]

# Per-process accounting for the services that matter. Without this, a memory
# climb shows up as "something grew" with no way to say what.
[[inputs.procstat]]
  systemd_unit = "signalk.service"
[[inputs.procstat]]
  systemd_unit = "grafana-server.service"
[[inputs.procstat]]
  systemd_unit = "influxdb.service"
[[inputs.procstat]]
  systemd_unit = "caddy.service"
[[inputs.procstat]]
  systemd_unit = "dex.service"

# SoC temperature and throttling. A Pi that silently throttles looks like a
# software problem until you check this.
[[inputs.temp]]

[[inputs.net]]
  interfaces = ["eth0", "wlan0", "can0"]

[[inputs.systemd_units]]
  unittype = "service"

# Process state counts, and `blocked` in particular. A task stuck in
# uninterruptible sleep never comes back and never shows up as CPU use, but it
# does hold load average up forever -- which is exactly how the v3d GPU hang
# presented on 2026-08-13 (RUNBOOK -> "Don't autostart a browser on the boat
# Pi"). Load alone can't tell "busy" from "wedged"; blocked can.
[[inputs.processes]]

# Context switches, interrupts and fork rate. When the box gets starved past
# the 15s watchdog it resets with no panic and no log tail, so the only
# evidence is the shape of the minutes before it -- see
# reference/legacy_openplotter_stack.md.
[[inputs.kernel]]

# Telegraf watching itself. `metrics_dropped` and `write_errors` are the
# difference between "the boat was quiet" and "we stopped recording," and
# without this input those two look identical in a dashboard.
[[inputs.internal]]

# Clock health. chrony is the only thing keeping this box's time honest -- it
# has no RTC -- and a silently unsynced clock corrupts every timestamp written
# here, plus TLS validity and OIDC token windows. `last_offset` and `stratum`
# are the ones to watch. There is no GPS refclock -- this boat's GNSS is on
# NMEA 2000, not a serial port -- so an internet outage means the clock is
# free-running, and `last_offset` on reconnect is how far it drifted.
[[inputs.chrony]]

# Under-voltage and thermal throttling straight from the SoC. See the script's
# own header: bus power is board power on this boat, so brownout has to be
# distinguishable from a software fault after the fact.
[[inputs.exec]]
  commands = ["/usr/local/bin/telegraf-rpi-health"]
  timeout = "10s"
  data_format = "influx"
