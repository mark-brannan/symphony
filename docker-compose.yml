name: symphony

networks:
  symphony-net:
    driver: bridge

include:
  - path: compose-signalk.yml
  - path: compose-ntfy.yml
  - path: compose-influxdb.yml
  - path: compose-questdb.yml
  - path: compose-grafana.yml
  - path: compose-proxy.yml    # profile "tls" -- only runs with --profile tls (boat)
  - path: compose-idp.yml      # profile "tls" -- dex, the boat's OIDC issuer
  - path: compose-dev-idp.yml  # profile "dev-idp" -- local OIDC stand-in, never on the boat
  - path: compose-pypilot.yml  # profile "pypilot" -- autopilot; host-network, needs /dev/i2c-1
