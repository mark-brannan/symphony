services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3001:3000" # 3001 externally; SignalK owns 3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - symphony-net
    # Transitional, for as long as InfluxDB is still a native systemd service
    # on the boat Pi -- the same shape as the dex port mapping in
    # compose-idp.yml. With INFLUX_URL=http://host.docker.internal:8086 the
    # datasource resolves to the host gateway; once InfluxDB is a compose
    # service, INFLUX_URL becomes http://influxdb:8086 and this can go.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Start this one with `--no-deps` while InfluxDB is still native. Without
    # it, compose starts the influxdb service too, which binds 8086 -- the
    # port the native InfluxDB is already on. The container loses the race,
    # or wins it and takes the database offline.
    depends_on:
      - influxdb

volumes:
  grafana-data:
