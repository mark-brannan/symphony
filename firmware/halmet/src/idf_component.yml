# Managed component dependencies for the main (src) component, resolved from the
# ESP-IDF component registry and pinned in dependencies.lock like the rest.
dependencies:
  # SensESP's Signal K websocket client (signalk_ws_client) includes
  # <esp_websocket_client.h>, which ESP-IDF 5.x no longer bundles. Pinned exact to
  # the on-device-verified 1.7.0, which carries the mbedTLS concurrency fix.
  espressif/esp_websocket_client: "==1.7.0"
  # Transitive via arduino-esp32. Left floating, a manifest-hash change
  # re-solved it to 1.15.1, which asserts in the WiFi STA event handler ~2 s
  # after boot on halmet_espidf. 1.12.0 is the bench-verified version.
  espressif/mdns: "==1.12.0"
