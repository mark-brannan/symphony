name: Secret scan

# Split out of validate.yml (2026-08-19) so it can run on a wider trigger.
#
# validate.yml answers "will this break the boat" -- a wrong dashboard uid or
# a malformed compose file is caught soon enough at PR time, because nothing
# reaches the boat without a merge. These jobs answer a different question:
# "has a credential reached the public internet." That deadline is the push
# itself, not the PR, and this repo is public.
#
# The gap this closes: validate.yml fires on `push: branches: [main]` and on
# `pull_request`. A claude/* branch pushed without a PR matched neither, so
# nothing scanned it until someone opened one. scripts/prepush_secret_scan.sh
# covers the same window locally, but `git push --no-verify` skips it and CI
# cannot be skipped from a laptop. Both layers, deliberately.
#
# Why no paths: filter, though it would cut the run count: gitleaks exists to
# catch credential-shaped strings in files sops was never told about -- a
# path allowlist would gate it on the same "files we thought about" list
# whose gaps are the actual leak path. It would also be incoherent: both
# scanners run over FULL history (fetch-depth: 0), so filtering on one
# push's changed files would skip a whole-history scan because the newest
# commit only touched a README.
#
# Nothing here needs the age key. The encryption checks work on ciphertext
# by design.

on:
  push:
    branches: ['**']
  workflow_dispatch:
  schedule:
    # Weekly re-scan of unchanged history. Not redundant: trufflehog ships
    # new detectors continuously, so a commit that was clean last month can
    # be flagged this month by a detector that didn't exist then.
    - cron: "17 9 * * 1"

# A session that pushes four times in two minutes only needs the newest
# commit scanned; superseded runs are cancelled. Scheduled runs are exempt --
# the weekly sweep of unchanged history is the one run that must not be
# cancelled by an unrelated push landing on the same ref.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  # Asserts .sops.yaml and .gitattributes still describe the same set of
  # files. A file with a sops rule but no filter entry commits as PLAINTEXT
  # and nothing else would notice.
  sops-config-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: python3 scripts/sops_paths.py check

  # Asserts every secret-bearing file is encrypted in what git actually
  # stores. File list is derived from .sops.yaml, so adding a secret
  # extends this check automatically.
  secrets-encrypted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: bash scripts/verify_encrypted.sh

  # Pattern/entropy scan over the entire history, not just the diff --
  # catches a secret introduced in any commit on the branch, including one
  # that a bypassed local hook let through. Pinned to the same version the
  # pre-commit hook uses so laptop and CI agree.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            git --no-banner --redact --verbose \
            --config /repo/.gitleaks.toml \
            --exit-code 1

  # Complements gitleaks rather than duplicating it: trufflehog calls the
  # provider API to check whether a candidate credential is actually live.
  # It fails only on confirmed-live secrets, so a red build here is never a
  # false alarm and is always urgent.
  #
  # Wrapped in a script because trufflehog has no --redact flag and prints
  # raw secret values -- this repo's Actions logs are public, so the wrapper
  # reports detector/file/commit only. Run it locally the same way.
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: trufflehog (verified-live secrets, full history)
        run: bash scripts/scan_verified_secrets.sh

  # The guards above are code, and until now nothing automated ran their
  # tests -- the suites existed but only ever ran when someone remembered to.
  # They belong here rather than in validate.yml for the same reason as the
  # rest of this file: they cover the secret-handling path, so they should
  # run on every branch push, not only on main and PRs.
  #
  # One entry point on purpose: scripts/run_secret_tooling_tests.sh owns the
  # canonical list of suites, and the pre-commit hook of the same name runs
  # the same script -- so a suite added there runs here with no second copy
  # of the list to forget (.sops.yaml's header bans keeping one).
  #
  # No age key, no sops binary, no network. Tests that open the real
  # encrypted store gate on secretguard.can_decrypt() and skip on a keyless
  # runner -- strict says how rigorously to enforce, not that this machine
  # holds keys, and this workflow deliberately holds none.
  secret-tooling-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: bash scripts/run_secret_tooling_tests.sh
