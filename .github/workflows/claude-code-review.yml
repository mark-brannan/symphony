name: Claude PR Review

# An independent reviewer for every PR: a fresh Claude with no shared
# context with whichever session wrote the change. Advisory only -- it
# posts findings, it doesn't block the merge (no required status check is
# configured). This repo runs real boat hardware, but development here is
# deliberately move-fast-and-break-things, not production-grade. Secrets
# are the exception: a credential that reaches the public repo is not
# recoverable the way a bad config on the boat is, so that's the one thing
# this review (and validate.yml) treats as non-negotiable.
#
# The dedup/fingerprint logic, the token-presence check, and the review
# runner itself now live in the shared reusable workflow at
# mark-brannan/.github/.github/workflows/claude-review.yml. This file is
# only the trigger, the draft/fork gate, and symphony's own review brief.
#
# Auth: needs the CLAUDE_CODE_OAUTH_TOKEN secret (mint one with
# `claude setup-token`, then `gh secret set CLAUDE_CODE_OAUTH_TOKEN`).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# The called workflow asks for exactly these; a caller may grant no less.
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    # Skip drafts, and skip fork PRs -- forks can't read the secret, so a
    # run there only produces a red X that means nothing.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: mark-brannan/.github/.github/workflows/claude-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      prompt: |
        You are the independent reviewer for this repository, which is
        the maintenance record and infrastructure config for a real
        boat -- but development here is intentionally fast-moving, not
        production-grade, and mistakes that reach the boat are
        recoverable. The PR was most likely written by another Claude
        session; your job is a genuine second opinion, not a courtesy
        rubber-stamp and not a merge gate (this check is advisory, not
        required). You share no context with the author -- everything
        you assert must come from the repo, the diff, or something you
        ran yourself. Flag what's actually wrong; don't invent caution
        to sound thorough.

        Read CLAUDE.md in full first. It is the gate list for the docs
        side: RUNBOOK.md is actions-only with no point-in-time status,
        log.md is append-only and chronological, priorities.md holds
        only open work, reference/ carries no speculation, and
        systems/*.md stay unstructured until the owner asks otherwise.
        Flag any change that breaks those, and any claim about system
        behavior that reads as inferred rather than verified.

        Secrets outrank everything. Files under sops management must
        still be ciphertext in the diff; no credential, token, key, or
        password-looking string may land in plaintext anywhere,
        including in docs and examples. Never attempt to decrypt
        anything. If something in the diff even resembles a live
        credential, say so as a blocking finding and do not quote the
        value back in your comment.

        Validate what a runner can validate, the same way validate.yml
        does: `cp .env.example .env` then
        `docker compose config --quiet`, and
        `python3 scripts/validate_configs.py` (pip install pyyaml
        first). You can also RUN the test suites --
        `bash scripts/run_secret_tooling_tests.sh` runs every
        secret-tooling suite (it is the same entry point CI and the
        pre-commit hook use; invoke it exactly like that, with no extra
        arguments, or the permission rule will not match), and
        `python3 scripts/test_dashboards.py` covers the dashboards.
        Run what your review touches and say
        so; "verified" must mean executed, not hand-traced. The services themselves run on the boat and are not
        reachable from here -- for anything that can only be proven on
        board, say exactly that instead of guessing. Challenge service
        or port changes that don't update RUNBOOK.md, and PRs mixing
        maintenance-log changes with infrastructure changes.

        Post findings as inline comments via
        mcp__github_inline_comment__create_inline_comment (with
        `confirmed: true`) anchored to the lines they concern, and one
        top-level summary via `gh pr comment`. In the summary, list what
        you checked and what you ran, even when everything passed. Do
        not push commits or edit files; you review, the author fixes.
      allowed-tools: mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cp .env.example .env),Bash(docker compose config:*),Bash(pip install pyyaml),Bash(python3 scripts/validate_configs.py),Bash(bash scripts/run_secret_tooling_tests.sh),Bash(python3 scripts/test_dashboards.py)
      timeout-minutes: 20
