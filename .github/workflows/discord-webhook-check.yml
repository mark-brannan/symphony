name: Discord webhook check

# Runs scripts/discord_webhook_check.py against the stored secret, which gh cannot read back.

on:
  pull_request:
    paths: [scripts/discord_webhook_check.py, scripts/discord_notify.py, .github/workflows/discord-webhook-check.yml]
  workflow_dispatch:
    inputs:
      post_sample:
        description: Also post a sample outage message, edit it through every event, then delete it
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/discord_webhook_check.py ${{ github.event_name == 'workflow_dispatch' && inputs.post_sample && '--post-sample' || '' }}
        env:
          SYMPHONY_DISCORD_ALARMING_WEBHOOK: ${{ secrets.SYMPHONY_DISCORD_ALARMING_WEBHOOK }}
