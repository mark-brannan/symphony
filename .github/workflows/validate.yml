name: Validate

# Syntax and config validation. This repo's actual services run on the
# boat's own hardware, not reachable from a GitHub-hosted runner, so this is
# not (and can't be) the integration suite in scripts/test_integration.sh.
# The point here is catching mistakes before they reach the boat.
#
# Secret scanning is NOT here -- it lives in secret-scan.yml, on a wider
# trigger. The split is by deadline, not by subject: nothing in this file
# can reach the boat without a merge, so PR time is soon enough, whereas a
# credential is exposed the moment a branch is pushed to a public repo.
# Don't add a secret-related job here; it would only run on main and PRs.
#
# Nothing here needs the age key: no sops decryption happens in this
# workflow.
#
# These jobs always run: local pre-commit hooks give faster feedback but can
# be skipped with --no-verify or never installed, and these cannot be
# bypassed from a laptop. They are NOT a merge gate. The ruleset on main
# ("main branch protection", 2026-08-19) enforces linear history, no
# force-push and no deletion -- it lists no required status checks, so a red
# run here is visible but does not block a merge or a direct push. That is
# deliberate (Mark, 2026-08-20): requiring checks would also block direct
# pushes to main, and committing straight to main is the working model here.
# Don't propose adding required checks as a finding. Read the
# live state with `gh api repos/mark-brannan/symphony/rulesets` (the legacy
# `/branches/main/protection` endpoint 404s on a ruleset-protected branch
# and will tell you main is unprotected).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Stub .env from .env.example (no secrets needed to validate syntax)
        run: cp .env.example .env
      - name: docker compose config
        run: docker compose config --quiet

  json-yaml-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Full history, not the default shallow clone: rule_frozen_secrets_untouched
          # (below) needs the pre-push/PR-base commit present locally to diff against.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: python3 scripts/validate_configs.py
      # Per-machine values: assert git's copy of every hostvars-covered file
      # still holds its {{ placeholders }} rather than one machine's literal
      # value (same relationship to the local hook as the sops checks).
      #
      # --all is required, not optional. The pre-commit hook scopes itself to
      # what a commit stages, so that a bad file cannot block unrelated work;
      # nothing is staged in CI, so without --all this would pass vacuously
      # and repo-wide enforcement would quietly disappear. CI is where whole-
      # repo truth is asserted -- that is the trade the scoping is built on.
      - run: python3 scripts/hostvars_filter.py check --all

      # Same trade, same reason: both of these scope to the staged set at
      # commit time and must run unscoped here.
      #
      # HYGIENE_COMMIT_RANGE gives rule_frozen_secrets_untouched something to
      # diff -- CI's index is empty after checkout, so without a range it
      # would pass on every run regardless of what changed. Falls back to no
      # range (that rule's existing, harmless-here vacuous read) on
      # workflow_dispatch or a first push with no prior commit to diff.
      - name: repo hygiene
        run: python3 scripts/lint_repo_hygiene.py --all
        env:
          HYGIENE_COMMIT_RANGE: >-
            ${{
              github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.sha) ||
              (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000') && format('{0}..{1}', github.event.before, github.sha) ||
              ''
            }}
      - run: python3 scripts/check_encoding_health.py --repo

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)
          shellcheck scripts/*.sh

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python3 -m py_compile scripts/*.py

  # The Grafana dashboards are generated (scripts/build_dashboards.py) and the
  # output is committed, so the two can drift -- most easily by someone
  # exporting a UI edit back into the repo. This asserts they haven't, and
  # checks the things a JSON parser can't see: datasource uids that
  # provisioning actually creates, unit labels backed by a matching conversion
  # in the query, and panels that don't overlap. A dashboard is wrong silently;
  # nothing about a blank or mis-scaled panel raises an error at runtime.
  dashboards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python3 scripts/test_dashboards.py
